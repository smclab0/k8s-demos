apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-dashboard
  namespace: apps
  annotations:
    # Public ACME (Let's Encrypt/ZeroSSL) can't validate a hostname that
    # resolves to a private RFC1918 address -- using the cluster's internal
    # CA instead, same pattern every other app here already uses.
    cert-manager.io/cluster-issuer: lenny-internal-ca-issuer
spec:
  ingressClassName: traefik
  rules:
    # trading.example.com is a placeholder -- override via a local overlay
    # (see overlays/local/, not checked into git) with your own
    # hostname, e.g. trading.<traefik's external IP>.sslip.io.
    - host: trading.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-dashboard
                port:
                  number: 80
  tls:
    - hosts:
        - trading.example.com
      secretName: trading-dashboard-tls
