apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-dashboard
  namespace: apps
  annotations:
    # Public ACME (Let's Encrypt/ZeroSSL) can't validate a hostname that
    # resolves to a private RFC1918 address -- using the cluster's internal
    # CA instead, same pattern every other app here already uses.
    cert-manager.io/cluster-issuer: lenny-internal-ca-issuer
spec:
  ingressClassName: traefik
  rules:
    # Placeholder only: once running, the dashboard pod replaces it (here and
    # in tls below) with trading.<its node's IP>.sslip.io -- see
    # ingress_host_loop in dashboard.yaml. sslip.io resolves that name to the
    # embedded IP, and traefik listens on every node's :80/:443 (hostPort), so
    # it works on whatever cluster/node this is deployed to.
    - host: trading.node-ip.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-dashboard
                port:
                  number: 80
  tls:
    - hosts:
        - trading.node-ip.sslip.io
      secretName: trading-dashboard-tls
