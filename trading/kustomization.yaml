apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No Namespace here: Fleet creates `trading` itself, and Helm refuses to adopt
# a Namespace that already exists. deploy.sh creates it
# if missing; Fleet does via defaultNamespace in fleet.yaml.
resources:
  - redis.yaml
  - price-feed.yaml
  - trading-engine.yaml
  - dashboard-rbac.yaml
  - dashboard.yaml
  - hft-bot.yaml
  - market-open-cron.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: stock-trading-demo
    includeSelectors: false
