apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No Namespace here: `apps` is shared with other apps, so this bundle mustn't
# own it (Fleet/Helm refuse to adopt an existing one). deploy.sh creates it
# if missing; Fleet does via defaultNamespace in fleet.yaml.
resources:
  - redis.yaml
  - price-feed.yaml
  - trading-engine.yaml
  - dashboard-rbac.yaml
  - dashboard.yaml
  - hft-bot.yaml
  - market-open-cron.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: stock-trading-demo
    includeSelectors: false
