apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-open
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: market-open-scaler
  namespace: apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["hft-bot"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: market-open-scaler
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: market-open
    namespace: apps
roleRef:
  kind: Role
  name: market-open-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-open
  namespace: apps
spec:
  schedule: "*/14 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Generous ceiling covering the max configurable cycle (3 x 60min phases
      # = 10800s) plus buffer, so a long-duration config doesn't get the job
      # killed mid-phase (which would strand hft-bot at whatever scale it was
      # last set to).
      activeDeadlineSeconds: 11100
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: market-open
          containers:
            - name: trigger
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl jq >/tmp/apk.log 2>&1

                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  API=https://kubernetes.default.svc

                  scale() {
                    curl -sS --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/merge-patch+json" \
                      -X PATCH "$API/apis/apps/v1/namespaces/apps/deployments/hft-bot/scale" \
                      -d "{\"spec\":{\"replicas\":$1}}"
                    echo
                  }

                  # Bot counts and phase durations come from /config (editable via
                  # the dashboard's /admin page) instead of being hardcoded, so tuning
                  # them doesn't need a redeploy. Snapshotted once per cycle; a
                  # mid-cycle edit takes effect next cycle. Note: this CronJob's own
                  # schedule (how often a new cycle STARTS) is a static field and
                  # can't be rewritten from here -- if the durations below no longer
                  # sum to close to the schedule interval, cycles will run back-to-back
                  # with a gap or get skipped by concurrencyPolicy:Forbid, not corrupt.
                  CONFIG=$(curl -sS -m 60 http://trading-engine.apps.svc.cluster.local/config || echo '{}')
                  OPEN_BOTS=$(echo "$CONFIG" | jq -r '.open_bots // 30')
                  QUIET_BOTS=$(echo "$CONFIG" | jq -r '.quiet_bots // 2')
                  CLOSED_BOTS=$(echo "$CONFIG" | jq -r '.closed_bots // 0')
                  OPEN_SECS=$(( $(echo "$CONFIG" | jq -r '.open_minutes // 8') * 60 ))
                  QUIET_SECS=$(( $(echo "$CONFIG" | jq -r '.quiet_minutes // 3') * 60 ))
                  CLOSED_SECS=$(( $(echo "$CONFIG" | jq -r '.closed_minutes // 3') * 60 ))
                  echo "using config: open=${OPEN_BOTS}bots/${OPEN_SECS}s quiet=${QUIET_BOTS}bots/${QUIET_SECS}s closed=${CLOSED_BOTS}bots/${CLOSED_SECS}s"

                  echo "=== phase 1/3: market open, applying volatility jolt ==="
                  curl -sS -m 60 -X POST http://trading-engine.apps.svc.cluster.local/market-open
                  echo
                  scale "$OPEN_BOTS"
                  sleep "$OPEN_SECS"

                  echo "=== phase 2/3: quiet trading ==="
                  scale "$QUIET_BOTS"
                  sleep "$QUIET_SECS"

                  echo "=== phase 3/3: market close ==="
                  curl -sS -m 60 -X POST http://trading-engine.apps.svc.cluster.local/market-close
                  echo
                  scale "$CLOSED_BOTS"
                  sleep "$CLOSED_SECS"

                  echo "=== cycle complete, next open begins at the next scheduled tick ==="
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 64Mi
