    </style>
    </head>
    <body>
      <header><div class="wrap bar"><div class="logo"><i>&#9670;</i>Stock Trading Demo</div></div></header>
      <main class="wrap auth">
        <section>
          <h1>Trading that runs on <span>Kubernetes</span>.</h1>
          <p class="lead">A pretend stock market made of microservices, used to load test the cluster it runs on.</p>
          <ul class="feat">
            <li><span class="ic">&#128200;</span><div><b>26 live tickers</b><small>Prices move every couple of seconds, with a volatility jolt at each market open.</small></div></li>
            <li><span class="ic">&#129302;</span><div><b>An HFT bot swarm</b><small>Bots scale with the cluster's node count and trade against you through each market cycle.</small></div></li>
            <li><span class="ic">&#128188;</span><div><b>Your own portfolio</b><small>Every account starts with &sect;100,000 to buy, sell, or dump and run.</small></div></li>
          </ul>
          <div class="demo">&#129514; Demo market: every ticker and &sect; here is play money.</div>
        </section>
        <form class="panel" method="post" action="/login">
          <h2>Sign in</h2>
          <p class="muted">Use the account you were given (user1 to user9).</p>
          {{error}}
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
        </form>
