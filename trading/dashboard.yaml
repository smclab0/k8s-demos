      .logo i { width:30px; height:30px; border-radius:9px; background:var(--grad); display:grid; place-items:center; color:#fff; font-style:normal; font-size:16px; }
      .auth { display:grid; grid-template-columns: 1.2fr 1fr; gap:28px; align-items:center; min-height: calc(100vh - 64px); padding: 24px 0; }
      @media (max-width: 860px) { .auth { grid-template-columns: 1fr; } }
