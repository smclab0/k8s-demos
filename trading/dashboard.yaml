apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-dashboard-script
  namespace: apps
data:
  dashboard.py: |
    import hmac
    import json
    import os
    import secrets
    import socket
    import ssl
    import threading
    import time
    import urllib.request
    import urllib.error
    import urllib.parse
    import redis
    from http.cookies import SimpleCookie
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    r = redis.Redis(host="redis.apps.svc.cluster.local", port=6379, decode_responses=True,
                     socket_timeout=2, socket_connect_timeout=2)
    ENGINE = "http://trading-engine.apps.svc.cluster.local"

    # Logins: a fixed list of usernames sharing one password. The password comes
    # from the trading-users Secret, which deploy.sh creates and which is never
    # committed (this repo is public). Each user trades their own portfolio --
    # their username is the engine "source", alongside the bot swarm's "bot".
    USERS = {u.strip() for u in os.environ.get("TRADING_USERS", "").split(",") if u.strip()}
    PASSWORD = os.environ.get("TRADING_PASSWORD", "")
    SESSION_TTL = 12 * 3600
    MAX_LOGIN_FAILS = 10  # per username, per 15 minutes

    def check_login(username, password):
        """Returns None on success, else an error message for the login page."""
        if username not in USERS or not PASSWORD:
            return "wrong username or password"
        fails_key = f"login_fail:{username}"
        if int(r.get(fails_key) or 0) >= MAX_LOGIN_FAILS:
            return "too many failed attempts -- try again in 15 minutes"
        if hmac.compare_digest(password.encode(), PASSWORD.encode()):
            r.delete(fails_key)
            return None
        pipe = r.pipeline()
        pipe.incr(fails_key)
        pipe.expire(fails_key, 900)
        pipe.execute()
        return "wrong username or password"

    K8S_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    K8S_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_NAMESPACE = "apps"

    # Every order (accepted or rejected) runs the ORDER_SCRIPT via EVALSHA, so its
    # call-count delta between polls is a direct measure of order throughput.
    _orders_rate_state = {"calls": None, "time": None}

    def get_orders_per_sec():
        try:
            stats = r.info("commandstats")
            calls = stats.get("cmdstat_evalsha", {}).get("calls", 0)
            now = time.time()
            prev_calls, prev_time = _orders_rate_state["calls"], _orders_rate_state["time"]
            rate = None
            if prev_calls is not None and now > prev_time:
                rate = max(0.0, (calls - prev_calls) / (now - prev_time))
            _orders_rate_state["calls"] = calls
            _orders_rate_state["time"] = now
            return round(rate, 1) if rate is not None else None
        except Exception:
            return None

    def k8s_api_get(path):
        with open(K8S_TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(f"https://kubernetes.default.svc{path}", headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, context=ctx, timeout=2) as resp:
            return json.load(resp)

    def k8s_api_json_patch(path, ops):
        with open(K8S_TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}", data=json.dumps(ops).encode(), method="PATCH",
            headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json-patch+json"})
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.load(resp)

    # The Ingress host isn't baked into ingress.yaml: this pod sets it to
    # trading.<its node's address>.<WILDCARD_DNS>, so it works on whatever
    # cluster and node it's deployed to -- traefik listens on every node's
    # :80/:443, so any node's address reaches it. TRADING_HOST pins a fixed
    # hostname instead. Re-checked every 5s: every `kubectl apply` (e.g.
    # deploy.sh) resets the host to ingress.yaml's placeholder, so this keeps
    # that outage to a few seconds.
    INGRESS_PATH = f"/apis/networking.k8s.io/v1/namespaces/{K8S_NAMESPACE}/ingresses/trading-dashboard"
    NODE_ADDRESS_TTL = 300  # re-resolve every 5 min; a node's address rarely changes

    def aws_public_ip():
        # EC2 instance metadata (IMDSv2). Self-managed k3s/rke2 on EC2 usually
        # don't record the public IP on the Node object, but the instance knows
        # it. Fails fast (and harmlessly) anywhere that isn't EC2.
        try:
            token_req = urllib.request.Request("http://169.254.169.254/latest/api/token", method="PUT",
                                               headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
            with urllib.request.urlopen(token_req, timeout=1) as resp:
                token = resp.read().decode()
            ip_req = urllib.request.Request("http://169.254.169.254/latest/meta-data/public-ipv4",
                                            headers={"X-aws-ec2-metadata-token": token})
            with urllib.request.urlopen(ip_req, timeout=1) as resp:
                return resp.read().decode().strip() or None
        except Exception:
            return None

    def node_address():
        """This pod's node's externally reachable address: its ExternalIP if the
        cluster records one (EKS and most managed clouds), else the EC2 public IP,
        else its InternalIP (status.hostIP) -- right for an on-prem cluster, but
        a private VPC address on a cloud."""
        node_name = os.environ.get("NODE_NAME", "").strip()
        if node_name:
            try:
                for addr in k8s_api_get(f"/api/v1/nodes/{node_name}")["status"].get("addresses", []):
                    if addr.get("type") == "ExternalIP" and addr.get("address"):
                        return addr["address"], "node ExternalIP"
            except Exception as e:
                print(f"couldn't read node {node_name}: {e}", flush=True)
        public_ip = aws_public_ip()
        if public_ip:
            return public_ip, "EC2 public IP"
        node_ip = os.environ.get("NODE_IP", "").strip()
        return (node_ip, "node InternalIP") if node_ip else (None, None)

    _node_address = {"value": None, "source": None, "at": 0.0}

    def desired_ingress_host():
        fixed = os.environ.get("TRADING_HOST", "").strip()
        if fixed:
            return fixed
        if not _node_address["value"] or time.time() - _node_address["at"] > NODE_ADDRESS_TTL:
            value, source = node_address()
            if value and value != _node_address["value"]:
                print(f"using {source} {value}", flush=True)
            _node_address.update(value=value, source=source, at=time.time())
        if not _node_address["value"]:
            return None
        return f"trading.{_node_address['value']}.{os.environ.get('WILDCARD_DNS', '').strip() or 'sslip.io'}"

    def ingress_host_loop():
        while True:
            try:
                want = desired_ingress_host()
                if want:
                    spec = k8s_api_get(INGRESS_PATH)["spec"]
                    ops = []
                    if spec["rules"][0].get("host") != want:
                        ops.append({"op": "replace", "path": "/spec/rules/0/host", "value": want})
                    if spec.get("tls") and spec["tls"][0]["hosts"][0] != want:
                        ops.append({"op": "replace", "path": "/spec/tls/0/hosts/0", "value": want})
                    if ops:
                        k8s_api_json_patch(INGRESS_PATH, ops)
                        print(f"ingress host set to {want}", flush=True)
            except Exception as e:
                print(f"ingress host update failed: {e}", flush=True)
            time.sleep(5)

    def get_bot_count():
        try:
            data = k8s_api_get(f"/apis/apps/v1/namespaces/{K8S_NAMESPACE}/deployments/hft-bot")
            status = data.get("status", {})
            return {"desired": status.get("replicas", 0), "ready": status.get("readyReplicas", 0)}
        except Exception:
            return {"desired": None, "ready": None}

    def get_engine_count():
        try:
            data = k8s_api_get(f"/apis/apps/v1/namespaces/{K8S_NAMESPACE}/deployments/trading-engine")
            status = data.get("status", {})
            return {"desired": status.get("replicas", 0), "ready": status.get("readyReplicas", 0)}
        except Exception:
            return {"desired": None, "ready": None}

    def get_node_count():
        try:
            data = k8s_api_get("/api/v1/nodes")
            items = data.get("items", [])
            ready = sum(
                1 for n in items
                if any(c.get("type") == "Ready" and c.get("status") == "True" for c in n.get("status", {}).get("conditions", []))
            )
            return {"total": len(items), "ready": ready}
        except Exception:
            return {"total": None, "ready": None}

    def engine_get(path, timeout=4):
        with urllib.request.urlopen(f"{ENGINE}{path}", timeout=timeout) as resp:
            return json.load(resp)

    def engine_post(path, payload, timeout=4):
        data = json.dumps(payload).encode()
        req = urllib.request.Request(
            f"{ENGINE}{path}", data=data,
            headers={"Content-Type": "application/json"}, method="POST"
        )
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return resp.status, json.load(resp)
        except urllib.error.HTTPError as e:
            try:
                return e.code, json.load(e)
            except Exception:
                return e.code, {"error": "engine returned an unreadable error"}
        except (urllib.error.URLError, socket.timeout, TimeoutError):
            return 503, {"error": "trading-engine is busy, try again"}

    LOGIN_PAGE = """<html>
