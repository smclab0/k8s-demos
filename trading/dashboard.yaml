      .demo { background:#fff7e6; color:#6b4a00; border:1px dashed #e7b75a; border-radius:12px; padding:9px 12px; font-size:13px; }
      @media (prefers-color-scheme: dark) { .demo { background:#2a2210; color:#f2d48e; border-color:#7d6326; } }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:var(--shadow); }
