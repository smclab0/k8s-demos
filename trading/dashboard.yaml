apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-dashboard-script
  namespace: apps
data:
  dashboard.py: |
    import json
    import os
    import socket
    import ssl
    import threading
    import time
    import urllib.request
    import urllib.error
    import redis
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    r = redis.Redis(host="redis.apps.svc.cluster.local", port=6379, decode_responses=True,
                     socket_timeout=2, socket_connect_timeout=2)
    ENGINE = "http://trading-engine.apps.svc.cluster.local"

    K8S_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    K8S_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_NAMESPACE = "apps"

    # Every order (accepted or rejected) runs the ORDER_SCRIPT via EVALSHA, so its
    # call-count delta between polls is a direct measure of order throughput.
    _orders_rate_state = {"calls": None, "time": None}

    def get_orders_per_sec():
        try:
            stats = r.info("commandstats")
            calls = stats.get("cmdstat_evalsha", {}).get("calls", 0)
            now = time.time()
            prev_calls, prev_time = _orders_rate_state["calls"], _orders_rate_state["time"]
            rate = None
            if prev_calls is not None and now > prev_time:
                rate = max(0.0, (calls - prev_calls) / (now - prev_time))
            _orders_rate_state["calls"] = calls
            _orders_rate_state["time"] = now
            return round(rate, 1) if rate is not None else None
        except Exception:
            return None

    def k8s_api_get(path):
        with open(K8S_TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(f"https://kubernetes.default.svc{path}", headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, context=ctx, timeout=2) as resp:
            return json.load(resp)

    def k8s_api_json_patch(path, ops):
        with open(K8S_TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}", data=json.dumps(ops).encode(), method="PATCH",
            headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json-patch+json"})
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.load(resp)

    # The Ingress host isn't baked into ingress.yaml: this pod sets it to
    # trading.<its node's IP>.<WILDCARD_DNS> (NODE_IP comes from the downward
    # API), so it works on whatever cluster and node it's deployed to -- traefik
    # listens on every node's :80/:443, so any node's IP reaches it. TRADING_HOST
    # pins a fixed hostname instead. Re-checked every minute, so a re-apply or
    # hand edit that changes the host gets put back.
    INGRESS_PATH = f"/apis/networking.k8s.io/v1/namespaces/{K8S_NAMESPACE}/ingresses/trading-dashboard"

    def desired_ingress_host():
        fixed = os.environ.get("TRADING_HOST", "").strip()
        if fixed:
            return fixed
        node_ip = os.environ.get("NODE_IP", "").strip()
        if not node_ip:
            return None
        return f"trading.{node_ip}.{os.environ.get('WILDCARD_DNS', '').strip() or 'sslip.io'}"

    def ingress_host_loop():
        while True:
            try:
                want = desired_ingress_host()
                if want:
                    spec = k8s_api_get(INGRESS_PATH)["spec"]
                    ops = []
                    if spec["rules"][0].get("host") != want:
                        ops.append({"op": "replace", "path": "/spec/rules/0/host", "value": want})
                    if spec.get("tls") and spec["tls"][0]["hosts"][0] != want:
                        ops.append({"op": "replace", "path": "/spec/tls/0/hosts/0", "value": want})
                    if ops:
                        k8s_api_json_patch(INGRESS_PATH, ops)
                        print(f"ingress host set to {want}", flush=True)
            except Exception as e:
                print(f"ingress host update failed: {e}", flush=True)
            time.sleep(60)

    def get_bot_count():
        try:
            data = k8s_api_get(f"/apis/apps/v1/namespaces/{K8S_NAMESPACE}/deployments/hft-bot")
            status = data.get("status", {})
            return {"desired": status.get("replicas", 0), "ready": status.get("readyReplicas", 0)}
        except Exception:
            return {"desired": None, "ready": None}

    def get_engine_count():
        try:
            data = k8s_api_get(f"/apis/apps/v1/namespaces/{K8S_NAMESPACE}/deployments/trading-engine")
            status = data.get("status", {})
            return {"desired": status.get("replicas", 0), "ready": status.get("readyReplicas", 0)}
        except Exception:
            return {"desired": None, "ready": None}

    def get_node_count():
        try:
            data = k8s_api_get("/api/v1/nodes")
            items = data.get("items", [])
            ready = sum(
                1 for n in items
                if any(c.get("type") == "Ready" and c.get("status") == "True" for c in n.get("status", {}).get("conditions", []))
            )
            return {"total": len(items), "ready": ready}
        except Exception:
            return {"total": None, "ready": None}

    def engine_get(path, timeout=4):
        with urllib.request.urlopen(f"{ENGINE}{path}", timeout=timeout) as resp:
            return json.load(resp)

    def engine_post(path, payload, timeout=4):
        data = json.dumps(payload).encode()
        req = urllib.request.Request(
            f"{ENGINE}{path}", data=data,
            headers={"Content-Type": "application/json"}, method="POST"
        )
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return resp.status, json.load(resp)
        except urllib.error.HTTPError as e:
            try:
                return e.code, json.load(e)
            except Exception:
                return e.code, {"error": "engine returned an unreadable error"}
        except (urllib.error.URLError, socket.timeout, TimeoutError):
            return 503, {"error": "trading-engine is busy, try again"}

    PAGE = """<html>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Trading Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f5fa; --panel: #ffffff; --ink: #0f1630; --muted: #63708e; --faint: #9aa4bf; --line: #e2e6f0; --soft: #eef1f8;
        --brand: #4f46e5; --brand2: #14b8a6; --brand-soft: #eceafe; --pos: #16a36a; --danger: #d83a52;
        --grad: linear-gradient(135deg, #4f46e5, #14b8a6);
        --shadow: 0 1px 2px #0f163010, 0 10px 30px #0f16300d;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a0e1c; --panel: #121830; --ink: #e8ecf8; --muted: #8f9abb; --faint: #5d6890; --line: #232c4b; --soft: #182040;
                --brand-soft: #231f5c; --pos: #34d399; --shadow: 0 1px 2px #0006, 0 10px 30px #0005; }
      }
      * { box-sizing: border-box; }
      body { margin:0; padding: 0 16px 60px; background:var(--bg); color:var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      td, .price, .cash, .pnl, .bot-badge, .timeline-label { font-variant-numeric: tabular-nums; }
      h1 { margin:0; font-weight:850; font-size:21px; letter-spacing:-.6px; display:flex; align-items:center; gap:9px; }
      h1 i { width:30px; height:30px; border-radius:9px; background:var(--grad); display:grid; place-items:center; color:#fff; font-style:normal; font-size:16px; }
      .byline { margin: 0; font-size:13px; color:var(--muted); }
      .disclaimer { margin: 0.1em 0 0; font-size:12px; color:var(--faint); font-style:italic; }
      h2 { color:var(--ink); font-size:17px; letter-spacing:-.3px; margin:0 0 12px; }
      table { border-collapse: collapse; width:100%; font: inherit; font-size:14px; color: inherit; }  /* quirks mode: tables don't inherit otherwise */
      th { padding: 6px 8px; text-align:right; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--line); }
      td { padding: 8px; text-align: right; border-bottom:1px solid var(--line); }
      tr:last-child td { border-bottom:0; }
      td:first-child, th:first-child { text-align:left; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); }

      .topbar { position:sticky; top:0; z-index:10; margin: 0 -16px 22px; padding: 12px 16px 14px; background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(12px); border-bottom:1px solid var(--line); }
      .topbar > *, .layout { max-width: 1200px; margin-left:auto; margin-right:auto; }
      .topbar-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
      .badge-group { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
      .bot-badge { background:var(--soft); border-radius:99px; padding:6px 12px; font-size:13px; font-weight:650; color:var(--muted); white-space:nowrap; }
      .bot-badge .n { color:var(--brand); font-weight:800; }
      .bot-badge.idle .n { color:var(--faint); }
      .bot-badge.busy .n { color:var(--brand2); }
      .timeline-card { margin-top: 12px; }
      .timeline-track { position:relative; display:flex; height: 28px; border-radius:99px; overflow:hidden; background:var(--soft); padding:3px; gap:3px; }
      .timeline-seg { flex:1; display:flex; align-items:center; justify-content:center; border-radius:99px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); transition: background 0.4s, color 0.4s; }
      .timeline-seg.active { color:#fff; }
      .timeline-seg[data-phase="open"].active { background: #16a36a; }
      .timeline-seg[data-phase="quiet"].active { background: var(--grad); }
      .timeline-seg[data-phase="closed"].active { background: var(--danger); }
      .timeline-marker { position:absolute; top:0; bottom:0; width:3px; border-radius:3px; background:var(--ink); opacity:.7; transition: left 1s linear; }
      .timeline-label { margin: 6px 0 0; font-size:13px; color:var(--muted); }
      #market-status.fresh { color: var(--brand2); font-weight: 700; }
      #market-status.closed { color: var(--danger); }
      .conn-badge { color:var(--danger); font-weight:700; display:none; }
      .status-row { display:flex; align-items:center; gap:8px; margin-top:4px; font-size:14px; color:var(--muted); flex-wrap:wrap; }
      .live-dot { width:8px; height:8px; border-radius:50%; background:var(--pos); box-shadow:0 0 0 3px color-mix(in srgb, var(--pos) 25%, transparent); flex-shrink:0; animation: pulse 2s ease-in-out infinite; }
      .live-dot.stale { background:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); animation:none; }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
      .msg { min-height: 1.2em; margin:4px 0 0; font-size:14px; font-weight:650; }
      .msg.ok { color: var(--pos); }
      .msg.err { color: var(--danger); }

      .layout { display:grid; grid-template-columns: 1fr 360px; gap: 18px; align-items:start; }
      .main-col { display:flex; flex-direction:column; gap: 18px; min-width:0; }
      .side-col { display:flex; flex-direction:column; gap: 18px; position:sticky; top: 150px; }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .side-col { position:static; }
        .topbar { position:static; }
      }

      /* the portfolio card is the gradient "hero", like a bank balance */
      .hero { color:#fff; border:0; border-radius:24px; padding:22px; position:relative; overflow:hidden;
              background: radial-gradient(circle at 90% 0%, #14b8a6aa, transparent 45%), radial-gradient(circle at 0% 100%, #a855f766, transparent 50%), linear-gradient(135deg, #1e1b4b, #312e81 60%, #0f766e); }
      .hero h2 { color:#fff; opacity:.8; font-size:14px; font-weight:650; margin-bottom:2px; }
      .hero th { color:#ffffffaa; border-bottom-color:#ffffff26; }
      .hero td { border-bottom-color:#ffffff1a; }
      .cash { font-size: clamp(30px, 4vw, 40px); font-weight:850; letter-spacing:-1.5px; line-height:1.1; margin: 0 0 8px; }
      .cash small { display:block; font-size:14px; font-weight:650; letter-spacing:0; opacity:.8; margin-top:4px; }
      .pnl { font-size:15px; font-weight:700; margin: 0 0 14px; display:inline-block; padding:2px 10px; border-radius:99px; background:#ffffff1f; }
      .pnl.up { color: #6ee7b7; }
      .pnl.down { color: #fda4af; }
      #pending-box { margin-top: 14px; padding-top: 12px; border-top:1px dashed #ffffff40; }
      .pending-label { margin: 0 0 6px; font-size:13px; font-weight:700; opacity:.85; }

      form { margin-top: 4px; display:flex; gap: 8px; flex-wrap: wrap; align-items:center; }
      select, input { width:100%; padding: 11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font: inherit; }
      select:focus, input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
      button { cursor:pointer; width:100%; border:0; border-radius:12px; padding:10px 16px; font: inherit; font-weight:700; background:var(--soft); color:var(--ink); }
      button:hover { filter: brightness(1.06); }
      button.buy { background:#16a36a; color:#fff; }
      button.sell { background:var(--danger); color:#fff; }
      #sell-all-btn { background:color-mix(in srgb, var(--danger) 12%, var(--panel)); color:var(--danger); }
      button.dump { background:linear-gradient(135deg, #d83a52, #a21caf); color:#fff; }
      button.reset { background:var(--soft); color:var(--muted); }
      .qty-presets { display:flex; gap:6px; width:100%; flex-wrap:wrap; }
      .qty-preset { width:auto; flex:1 0 auto; padding:6px 0; border-radius:99px; font-size:13px; background:var(--soft); color:var(--muted); }
      .qty-preset:hover { color:var(--brand); }
      .qty-preset.active { background:var(--brand-soft); color:var(--brand); }
      button:disabled { opacity: 0.55; cursor: progress; }

      tr.mine td { background: var(--brand-soft); }
      tr.mine td:first-child::before { content: "\\2605  "; color: var(--brand); }
      .legend { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
      .legend .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--brand-soft); border:1px solid var(--brand); margin-right:5px; vertical-align:-1px; }
      .chart-wrap { position:relative; }
      .chart-tooltip { position:absolute; background:var(--ink); color:var(--panel); border-radius:10px; padding:6px 10px; font-size:13px; pointer-events:none; display:none; white-space:nowrap; }
