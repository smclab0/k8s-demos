                --brand-soft: #231f5c; --shadow: 0 1px 2px #0006, 0 10px 30px #0005; }
      }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
