apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-dashboard
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trading-dashboard-read-bots
  namespace: apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["hft-bot", "trading-engine"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trading-dashboard-read-bots
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: trading-dashboard
    namespace: apps
roleRef:
  kind: Role
  name: trading-dashboard-read-bots
  apiGroup: rbac.authorization.k8s.io
---
# Lets the dashboard point its own Ingress at the node it's running on
# (see ingress_host_loop in dashboard.yaml) -- this one Ingress only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trading-dashboard-set-ingress-host
  namespace: apps
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["trading-dashboard"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trading-dashboard-set-ingress-host
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: trading-dashboard
    namespace: apps
roleRef:
  kind: Role
  name: trading-dashboard-set-ingress-host
  apiGroup: rbac.authorization.k8s.io
---
# Nodes are cluster-scoped, so reading them needs a ClusterRole even though
# this ServiceAccount otherwise only touches things in the apps namespace.
# list: the node-count badge; get: its own node's ExternalIP for the Ingress host.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trading-dashboard-read-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trading-dashboard-read-nodes
subjects:
  - kind: ServiceAccount
    name: trading-dashboard
    namespace: apps
roleRef:
  kind: ClusterRole
  name: trading-dashboard-read-nodes
  apiGroup: rbac.authorization.k8s.io
