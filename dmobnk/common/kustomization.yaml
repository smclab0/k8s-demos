# Python modules shared by DMOBNK's apps, mounted at /opt/dmobnk:
#   ingress_host.py  points an app's Ingress at the cluster it runs on
#   redis_lite.py    a tiny Redis client (kiosk and CRM)
#   crm_feed.py      sends bank and kiosk events to a linked CRM
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: dmobnk-ingress-host
    namespace: dmobnk
    files:
      - ingress_host.py
      - redis_lite.py
      - crm_feed.py
