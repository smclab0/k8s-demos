# Settings for deploying this directory with Rancher Fleet (continuous
# delivery). Fleet renders the kustomization and installs it as a Helm release.

# Fleet creates `dmobnk` if it's missing. The bundle itself doesn't declare the
# namespace, because Helm won't adopt one that already exists (deploy.sh
# creates it when deploying without Fleet).
defaultNamespace: dmobnk

# Two cluster labels in Rancher decide what each cluster gets:
#   role = branch        -> the branch kiosk (branch/) instead of the online bank
#   role = admin         -> the online bank plus Kube Power, the admin control
#                           room, at /dmobnk/admin (admin/bank)
#   role = branch-admin  -> the branch kiosk plus Kube Power at /admin
#                           (admin/branch)
#   No role label, or another value: the online bank, without Kube Power.
#   The long key dmobnk.smclab.net/role works the same as role.
#   dmobnk.smclab.net/country = uk | us | de | sim -> language and currency.
#                               No label (or another value): UK.
# Fleet uses the FIRST entry below that matches, so the role entries come
# before the country-only ones. Changing a label makes Fleet redeploy on its own.
targetCustomizations:
  - name: branch-admin-us
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch-admin, dmobnk.smclab.net/country: us}
    kustomize: {dir: with-admin/branch/us}
  - name: branch-admin-de
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch-admin, dmobnk.smclab.net/country: de}
    kustomize: {dir: with-admin/branch/de}
  - name: branch-admin-sim
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch-admin, dmobnk.smclab.net/country: sim}
    kustomize: {dir: with-admin/branch/sim}
  - name: branch-admin
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch-admin}
    kustomize: {dir: with-admin/branch/uk}
  - name: branch-us
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch, dmobnk.smclab.net/country: us}
    kustomize: {dir: branch/countries/us}
  - name: branch-de
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch, dmobnk.smclab.net/country: de}
    kustomize: {dir: branch/countries/de}
  - name: branch-sim
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch, dmobnk.smclab.net/country: sim}
    kustomize: {dir: branch/countries/sim}
  - name: branch
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: branch}
    kustomize: {dir: branch}
  - name: admin-us
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: admin, dmobnk.smclab.net/country: us}
    kustomize: {dir: with-admin/bank/us}
  - name: admin-de
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: admin, dmobnk.smclab.net/country: de}
    kustomize: {dir: with-admin/bank/de}
  - name: admin-sim
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: admin, dmobnk.smclab.net/country: sim}
    kustomize: {dir: with-admin/bank/sim}
  - name: admin
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/role: admin}
    kustomize: {dir: with-admin/bank/uk}
  # The same, for clusters labelled with the short key role.
  - name: branch-admin-us-short
    clusterSelector:
      matchLabels: {role: branch-admin, dmobnk.smclab.net/country: us}
    kustomize: {dir: with-admin/branch/us}
  - name: branch-admin-de-short
    clusterSelector:
      matchLabels: {role: branch-admin, dmobnk.smclab.net/country: de}
    kustomize: {dir: with-admin/branch/de}
  - name: branch-admin-sim-short
    clusterSelector:
      matchLabels: {role: branch-admin, dmobnk.smclab.net/country: sim}
    kustomize: {dir: with-admin/branch/sim}
  - name: branch-admin-short
    clusterSelector:
      matchLabels: {role: branch-admin}
    kustomize: {dir: with-admin/branch/uk}
  - name: branch-us-short
    clusterSelector:
      matchLabels: {role: branch, dmobnk.smclab.net/country: us}
    kustomize: {dir: branch/countries/us}
  - name: branch-de-short
    clusterSelector:
      matchLabels: {role: branch, dmobnk.smclab.net/country: de}
    kustomize: {dir: branch/countries/de}
  - name: branch-sim-short
    clusterSelector:
      matchLabels: {role: branch, dmobnk.smclab.net/country: sim}
    kustomize: {dir: branch/countries/sim}
  - name: branch-short
    clusterSelector:
      matchLabels: {role: branch}
    kustomize: {dir: branch}
  - name: admin-us-short
    clusterSelector:
      matchLabels: {role: admin, dmobnk.smclab.net/country: us}
    kustomize: {dir: with-admin/bank/us}
  - name: admin-de-short
    clusterSelector:
      matchLabels: {role: admin, dmobnk.smclab.net/country: de}
    kustomize: {dir: with-admin/bank/de}
  - name: admin-sim-short
    clusterSelector:
      matchLabels: {role: admin, dmobnk.smclab.net/country: sim}
    kustomize: {dir: with-admin/bank/sim}
  - name: admin-short
    clusterSelector:
      matchLabels: {role: admin}
    kustomize: {dir: with-admin/bank/uk}
  - name: us
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/country: us}
    kustomize: {dir: countries/us}
  - name: de
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/country: de}
    kustomize: {dir: countries/de}
  - name: sim
    clusterSelector:
      matchLabels: {dmobnk.smclab.net/country: sim}
    kustomize: {dir: countries/sim}

# Fields the apps change on purpose at runtime -- don't report them as drift.
diff:
  comparePatches:
    # The web pods point their Ingress at the cluster they run on
    # (common/ingress_host.py).
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: dmobnk
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: branch-web
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
    # Kube Power does the same for its own Ingress (admin/base/kube_power.py).
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: kube-power
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
