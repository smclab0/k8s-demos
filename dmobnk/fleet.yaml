# Settings for deploying this directory with Rancher Fleet (continuous
# delivery). Fleet renders the kustomization and installs it as a Helm release.

# Fleet creates `dmobnk` if it's missing. The bundle itself doesn't declare the
# namespace, because Helm won't adopt one that already exists (deploy.sh
# creates it when deploying without Fleet).
defaultNamespace: dmobnk

# Cluster labels in Rancher decide what each cluster gets. Each is set to
# "true"; combine them as you like:
#   branch = true   the branch kiosk (branch/) instead of the online bank
#   crm    = true   the CRM (crm/) instead of the online bank; with
#                   branch=true, the kiosk and the CRM side by side
#   admin  = true   adds Kube Power, the admin control room (admin/), to
#                   whatever the cluster runs
#   None of them: the online bank on its own.
#   dmobnk.smclab.net/country = uk | us | de | sim -> language and currency.
#                               No label (or another value): UK.
# The list below is written by targets/generate.py (most specific first,
# since Fleet uses the FIRST entry that matches). A cluster with none of
# the labels and no country gets this directory's kustomization.yaml.
# Changing a label makes Fleet redeploy on its own.
targetCustomizations:
  # BEGIN generated by targets/generate.py
  - name: branch-crm-admin-us
    clusterSelector:
      matchLabels: {branch: "true", crm: "true", admin: "true", dmobnk.smclab.net/country: us}
    kustomize: {dir: targets/branch-crm-admin/us}
  - name: branch-crm-admin-de
    clusterSelector:
      matchLabels: {branch: "true", crm: "true", admin: "true", dmobnk.smclab.net/country: de}
    kustomize: {dir: targets/branch-crm-admin/de}
  - name: branch-crm-admin-sim
    clusterSelector:
      matchLabels: {branch: "true", crm: "true", admin: "true", dmobnk.smclab.net/country: sim}
    kustomize: {dir: targets/branch-crm-admin/sim}
  - name: branch-crm-admin-uk
    clusterSelector:
      matchLabels: {branch: "true", crm: "true", admin: "true"}
    kustomize: {dir: targets/branch-crm-admin/uk}
  - name: branch-crm-us
    clusterSelector:
      matchLabels: {branch: "true", crm: "true", dmobnk.smclab.net/country: us}
