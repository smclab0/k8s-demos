# Fields the apps change on purpose at runtime -- don't report them as drift.
diff:
  comparePatches:
    # The web pods point their Ingress at the cluster they run on
    # (common/ingress_host.py).
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: dmobnk
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: branch-web
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
    # Kube Power does the same for its own Ingress (admin/base/kube_power.py).
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: kube-power
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: crm-web
      namespace: dmobnk
      jsonPointers:
        - /spec/rules/0/host
        - /spec/ingressClassName
