# The lenny-new site: DMOBNK under https://dev.smclab.net/dmobnk/, next to the
# dev-website Ingress in `apps`, which keeps serving everything else on that
# host (ingress-nginx merges the two and picks the longest matching path).
# The overlays next to it (../uk, ../us, ../de, ../sim) add this component;
# deploy.sh uses them. Fleet clusters never get it.
#
# These Ingresses are fixed (annotation dmobnk.smclab.net/host: "off"), so
# the apps find them in place and leave them alone instead of creating
# their own sslip.io ones (../../../common/ingress_host.py).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ingress.yaml
