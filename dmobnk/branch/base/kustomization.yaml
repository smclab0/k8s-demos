apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The branch kiosk. Like the online bank, no Namespace here: Fleet or
# deploy.sh creates `dmobnk`.
resources:
  - branch.yaml
  - rbac.yaml

# branch.py lives as a plain file; the hash in the generated ConfigMap's name
# rolls the pods whenever it changes.
configMapGenerator:
  - name: dmobnk-branch-script
    namespace: dmobnk
    files:
      - branch.py

labels:
  - pairs:
      app.kubernetes.io/part-of: dmobnk
    includeSelectors: false
