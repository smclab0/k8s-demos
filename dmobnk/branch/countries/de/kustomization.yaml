# The DMOBNK branch for country "de": the branch base, with locale-de.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: branch-web}
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: locale-de
