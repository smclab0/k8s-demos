# Kube Power for the branch kiosk, at /admin on the kiosk's host. It can
# control branch-web (scale, kill a pod, rolling restart).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../base
resources:
  - role.yaml
patches:
  - target: {kind: Deployment, name: kube-power}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: kube-power}
      spec:
        template:
          spec:
            containers:
              - name: kube-power
                env:
                  - {name: ADMIN_BASE, value: "/admin"}
                  - {name: APP_URL, value: "/"}
                  - {name: APP_NAME, value: "the kiosk"}
                  - {name: HOST_PREFIX, value: "branch"}
                  - {name: ADMIN_APPS, value: "branch-web"}
                  - {name: ADMIN_HPA, value: ""}
                  - {name: ADMIN_SURGE, value: ""}
                  - {name: ADMIN_CRON, value: ""}
                  - name: SITE_HOST
                    valueFrom: {configMapKeyRef: {name: dmobnk-branch, key: host, optional: true}}
                  - name: INGRESS_CLASS
                    valueFrom: {configMapKeyRef: {name: dmobnk-branch, key: ingressClass, optional: true}}
  - target: {kind: Ingress, name: kube-power}
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /admin
