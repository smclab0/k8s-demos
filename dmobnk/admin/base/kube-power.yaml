# The control room's pod. It reads and acts on the dmobnk namespace (the
# Role in ../bank or ../branch), keeps its password in the dmobnk-admin
# Secret (creating it on first start) and points its own Ingress at the
# cluster, on the app's host under ADMIN_BASE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-power
  namespace: dmobnk
  labels: {app: kube-power, dmobnk.smclab.net/tier: admin}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-power}}
  template:
    metadata:
      labels: {app: kube-power, dmobnk.smclab.net/tier: admin}
    spec:
      serviceAccountName: kube-power
      containers:
        - name: kube-power
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/kube_power.py"]
          ports: [{containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: NODE_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
          # Ready once it has the admin password (see /healthz in kube_power.py).
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: lib, mountPath: /opt/dmobnk, readOnly: true}
      volumes:
        - {name: script, configMap: {name: kube-power-script}}
        - {name: lib, configMap: {name: dmobnk-ingress-host}}
---
apiVersion: v1
kind: Service
metadata: {name: kube-power, namespace: dmobnk}
spec: {selector: {app: kube-power}, ports: [{port: 80, targetPort: 8080}]}
---
# Same host as the app's Ingress; the path comes from ../bank or ../branch.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-power
  namespace: dmobnk
  annotations:
    dmobnk.smclab.net/host: auto
spec:
  rules:
    - host: admin.node-ip.sslip.io
      http:
        paths:
          - {path: /admin, pathType: Prefix, backend: {service: {name: kube-power, port: {number: 80}}}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-power
  namespace: dmobnk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-power
  namespace: dmobnk
subjects:
  - {kind: ServiceAccount, name: kube-power, namespace: dmobnk}
roleRef: {kind: Role, name: kube-power, apiGroup: rbac.authorization.k8s.io}
---
# Cluster-wide, read only: what ingress_host.py needs to find the cluster's
# external address (its node, LoadBalancer Services, IngressClasses).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dmobnk-kube-power
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dmobnk-kube-power
subjects:
  - {kind: ServiceAccount, name: kube-power, namespace: dmobnk}
roleRef: {kind: ClusterRole, name: dmobnk-kube-power, apiGroup: rbac.authorization.k8s.io}
