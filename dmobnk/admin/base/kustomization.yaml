# Kube Power, the admin control room, as its own Deployment. A Component:
# ../bank and ../branch add it to the online bank or the branch kiosk, and
# set what it may control. Only the role=admin / role=branch-admin overlays
# (../../with-admin) use them, so other clusters don't run it at all.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - kube-power.yaml
configMapGenerator:
  - name: kube-power-script
    namespace: dmobnk
    files:
      - kube_power.py
      - control.py
