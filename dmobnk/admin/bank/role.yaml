# Generated by targets/generate.py. Edit that, not this.
# What Kube Power may do, all within the dmobnk namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-power
  namespace: dmobnk
rules:
  # Read: the cluster map, deployments table, autoscaler and events.
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  # Kill a pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Scale out and rolling restart, on these deployments only.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: [web, accounts-svc, cards-svc, loans-svc, mortgage-svc, rates-svc, crossborder-svc]
    verbs: ["patch"]
  # Traffic surge: a Job of curl pods aimed at rates-svc.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "create"]
  # Its sign-in password: read it, or create it on first start.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dmobnk-admin"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Its own Ingress (ingress_host.py).
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["kube-power"]
    verbs: ["get", "patch"]
