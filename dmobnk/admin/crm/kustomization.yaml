# Generated by targets/generate.py. Edit that, not this.
# Kube Power for the CRM, at /admin on its host. It may control:
# crm-web.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../base
resources:
  - role.yaml
patches:
  - target: {kind: Deployment, name: kube-power}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: kube-power}
      spec:
        template:
          spec:
            containers:
              - name: kube-power
                env:
                  - {name: ADMIN_BASE, value: "/admin"}
                  - {name: APP_URL, value: "/"}
                  - {name: APP_NAME, value: "the CRM"}
                  - {name: HOST_PREFIX, value: "crm"}
                  - {name: ADMIN_APPS, value: "crm-web"}
                  - {name: ADMIN_HPA, value: ""}
                  - {name: ADMIN_SURGE, value: ""}
                  - {name: ADMIN_CRON, value: ""}
                  - name: SITE_HOST
                    valueFrom: {configMapKeyRef: {name: dmobnk-crm-site, key: host, optional: true}}
                  - name: INGRESS_CLASS
                    valueFrom: {configMapKeyRef: {name: dmobnk-crm-site, key: ingressClass, optional: true}}
  - target: {kind: Ingress, name: kube-power}
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /admin
