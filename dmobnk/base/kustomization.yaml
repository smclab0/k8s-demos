apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No Namespace here: deploy.sh creates `dmobnk`, so a Fleet/Helm install can
# own everything in it without fighting over the namespace itself.
resources:
  - redis.yaml
  - locales.yaml
  - services.yaml
  - web.yaml
  - rates-cron.yaml
  - ingress.yaml
  - admin.yaml

# web.py and control.py live as plain files; the generated ConfigMap gets a content hash in
# its name, so editing web.py rolls the web pods automatically.
configMapGenerator:
  - name: dmobnk-web-script
    namespace: dmobnk
    files:
      - web.py
      - control.py

labels:
  - pairs:
      app.kubernetes.io/part-of: dmobnk
    includeSelectors: false
