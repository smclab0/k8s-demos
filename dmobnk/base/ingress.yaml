# Works on any cluster: the web pods point it at this cluster once running
# (dmobnk.smclab.net/host: auto, see ../common/ingress_host.py), giving
# http://dmobnk.<cluster external address>.sslip.io/dmobnk/ and the cluster's
# default IngressClass. The host here is only a placeholder. To fix the host
# or class, create a `dmobnk-site` ConfigMap (keys: host, ingressClass) and
# restart deploy/web.
#
# lenny-new instead gets dev.smclab.net with TLS from ../sites/dev-smclab,
# which deploy.sh adds.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dmobnk
  namespace: dmobnk
  annotations:
    dmobnk.smclab.net/host: auto
spec:
  rules:
    - host: dmobnk.node-ip.sslip.io
      http:
        paths:
          # "/" rather than "/dmobnk", so the bare host redirects to /dmobnk/.
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
