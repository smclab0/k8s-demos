# DMOBNK lives under dev.smclab.net/dmobnk/. The dev-website Ingress in
# `apps` keeps serving everything else on that host; ingress-nginx merges
# the two and picks the longest matching path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dmobnk
  namespace: dmobnk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dev.smclab.net]
      secretName: dmobnk-tls
  rules:
    - host: dev.smclab.net
      http:
        paths:
          - {path: /dmobnk, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
