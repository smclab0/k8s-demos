# The DMOBNK front end. Its language and currency come from the mounted
# locale ConfigMap: locale-uk here, swapped by the Components in ../locales/country/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dmobnk
  labels: {app: web, dmobnk.smclab.net/tier: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata:
      labels: {app: web, dmobnk.smclab.net/tier: web}
    spec:
      # dmobnk-web (rbac.yaml) lets the pods point the Ingress at this
      # cluster (ingress.yaml), and nothing else.
      serviceAccountName: dmobnk-web
      automountServiceAccountToken: true
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: web}}}
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/web.py"]
          ports: [{containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: NODE_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            # Optional fixed Ingress host/class (see ingress.yaml).
            - name: SITE_HOST
              valueFrom: {configMapKeyRef: {name: dmobnk-site, key: host, optional: true}}
            - name: INGRESS_CLASS
              valueFrom: {configMapKeyRef: {name: dmobnk-site, key: ingressClass, optional: true}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: locale, mountPath: /locale, readOnly: true}
            - {name: lib, mountPath: /opt/dmobnk, readOnly: true}
            - {name: crm-link, mountPath: /etc/dmobnk-crm, readOnly: true}
            - {name: crm-local, mountPath: /etc/dmobnk-crm-local, readOnly: true}
      volumes:
        - {name: script, configMap: {name: dmobnk-web-script}}
        - {name: locale, configMap: {name: locale-uk}}
        # Keep locale second: the country overlays patch volumes/1.
        - {name: lib, configMap: {name: dmobnk-ingress-host}}
        # Linking to a CRM (../common/crm_feed.py). Optional: no Secret, no events.
        - {name: crm-link, secret: {secretName: dmobnk-crm-link, optional: true}}
        # A CRM on this same cluster: just its ingest token, so events reach
        # it with no link Secret.
        - name: crm-local
          secret: {secretName: dmobnk-crm, optional: true, items: [{key: token, path: token}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: dmobnk}
spec: {selector: {app: web}, ports: [{port: 80, targetPort: 8080}]}
