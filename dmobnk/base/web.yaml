# The DMOBNK front end. Its language and currency come from the mounted
# locale ConfigMap: locale-uk here, swapped by the overlays in ../countries/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dmobnk
  labels: {app: web, dmobnk.smclab.net/tier: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata:
      labels: {app: web, dmobnk.smclab.net/tier: web}
    spec:
      # dmobnk-web (admin.yaml) lets the Kube Power control room read and
      # act on the dmobnk namespace. Only signed-in admins can use it.
      serviceAccountName: dmobnk-web
      automountServiceAccountToken: true
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: web}}}
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/web.py"]
          ports: [{containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            # The control room's sign-in password. No Secret, no control room.
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: dmobnk-admin, key: password, optional: true}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: locale, mountPath: /locale, readOnly: true}
      volumes:
        - {name: script, configMap: {name: dmobnk-web-script}}
        - {name: locale, configMap: {name: locale-uk}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: dmobnk}
spec: {selector: {app: web}, ports: [{port: 80, targetPort: 8080}]}
