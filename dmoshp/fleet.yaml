# Fleet: DMOSHP, DMOCRP's retail arm, into the dmoshp namespace.
#
# Cluster labels in Rancher decide what each cluster gets. Each is set to
# "true", and they combine freely:
#   shop=true   the online shop            http://shop.<address>.sslip.io/
#   sok=true    the self-checkout          http://sok.<address>.sslip.io/
#   admin=true  adds Kube Power            /admin on the first app's host
# A cluster without shop or sok gets the shop. DMOBNK (../dmobnk) on the
# same cluster lets the apps take DMOBNK card payments and feed its CRM.
# The list below is generated: change targets/generate.py and run it.
defaultNamespace: dmoshp

targetCustomizations:
  # BEGIN generated by targets/generate.py
  - name: shop-sok-admin
    clusterSelector:
      matchLabels:
        shop: "true"
        sok: "true"
        admin: "true"
    kustomize:
      dir: targets/shop-sok-admin
  - name: shop-sok
    clusterSelector:
      matchLabels:
        shop: "true"
        sok: "true"
    kustomize:
      dir: targets/shop-sok
  - name: shop-admin
    clusterSelector:
      matchLabels:
        shop: "true"
        admin: "true"
    kustomize:
      dir: targets/shop-admin
  - name: sok-admin
    clusterSelector:
      matchLabels:
        sok: "true"
        admin: "true"
    kustomize:
      dir: targets/sok-admin
  - name: shop
    clusterSelector:
      matchLabels:
        shop: "true"
    kustomize:
      dir: targets/shop
  - name: sok
    clusterSelector:
      matchLabels:
        sok: "true"
    kustomize:
      dir: targets/sok
  - name: shop-admin-nolabel
    clusterSelector:
      matchLabels:
        admin: "true"
    kustomize:
      dir: targets/shop-admin
  # END generated

# Where Kube Power runs it owns the replica counts (see targets/generate.py).
diff:
  comparePatches:
    - apiVersion: apps/v1
      kind: Deployment
      name: shop-web
      namespace: dmoshp
      jsonPointers: [/spec/replicas]
    - apiVersion: apps/v1
      kind: Deployment
      name: sok-web
      namespace: dmoshp
      jsonPointers: [/spec/replicas]
