# Kube Power for DMOSHP: the same control room as DMOBNK's (control.py and
# kube_power.py are copies, see ../../sync-shared.sh). It acts on the dmoshp
# namespace (the Role in ../<combo>), keeps its password in the
# dmoshp-admin Secret (creating it with dmopwd1 on first start) and points
# its own Ingress at the cluster, on its app's host under /admin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-power
  namespace: dmoshp
  labels: {app: kube-power, dmoshp.smclab.net/tier: admin}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-power}}
  template:
    metadata:
      labels: {app: kube-power, dmoshp.smclab.net/tier: admin}
    spec:
      serviceAccountName: kube-power
      containers:
        - name: kube-power
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/kube_power.py"]
          ports: [{containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: NODE_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
          # Ready once it has the admin password (see /healthz in kube_power.py).
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: lib, mountPath: /opt/dmobnk, readOnly: true}
      volumes:
        - {name: script, configMap: {name: kube-power-script}}
        - {name: lib, configMap: {name: dmoshp-lib}}
---
apiVersion: v1
kind: Service
metadata: {name: kube-power, namespace: dmoshp}
spec: {selector: {app: kube-power}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-power
  namespace: dmoshp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-power
  namespace: dmoshp
subjects:
  - {kind: ServiceAccount, name: kube-power, namespace: dmoshp}
roleRef: {kind: Role, name: kube-power, apiGroup: rbac.authorization.k8s.io}
---
# Cluster-wide, read only: what ingress_host.py needs to find the cluster's
# external address (its node, LoadBalancer Services, IngressClasses).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dmoshp-kube-power
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dmoshp-kube-power
subjects:
  - {kind: ServiceAccount, name: kube-power, namespace: dmoshp}
roleRef: {kind: ClusterRole, name: dmoshp-kube-power, apiGroup: rbac.authorization.k8s.io}
