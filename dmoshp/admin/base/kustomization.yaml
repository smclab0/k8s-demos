# Kube Power for DMOSHP, as its own Deployment. A Component: ../<combo>
# (generated by ../../targets/generate.py) adds it and sets what it may
# control. Only admin=true clusters get it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - kube-power.yaml
configMapGenerator:
  - name: kube-power-script
    namespace: dmoshp
    files:
      - kube_power.py
      - control.py
