# Generated by targets/generate.py. Edit that, not this.
# What DMOSHP's Kube Power may do, all within the dmoshp namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-power
  namespace: dmoshp
rules:
  # Read: the cluster map, deployments table and events.
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
  # Kill a pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Scale out and rolling restart, on these deployments only.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: [shop-web]
    verbs: ["patch"]
  # Its sign-in password: read it, or create it on first start.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dmoshp-admin"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Its own Ingress, which it creates (owned by its Deployment) and keeps on
  # its app's host.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["kube-power"]
    verbs: ["get", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["shop-web"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kube-power"]
    verbs: ["get"]
