# The online shop on its own; ../base adds what the apps share.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - shop.yaml
configMapGenerator:
  - name: dmoshp-shop-script
    namespace: dmoshp
    files:
      - shop.py
labels:
  - pairs:
      app.kubernetes.io/part-of: dmoshp
    includeSelectors: false
