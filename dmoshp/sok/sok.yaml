# The self-checkout (sok.py). Optional settings in the dmoshp-sok ConfigMap:
#   host          the Ingress host (default: sok.<external address>.sslip.io)
#   ingressClass  the IngressClass (default: the cluster's default class)
#   name          the store (default: London Bridge)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sok-web
  namespace: dmoshp
  labels: {app: sok-web, dmoshp.smclab.net/tier: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: sok-web}}
  template:
    metadata:
      labels: {app: sok-web, dmoshp.smclab.net/tier: web}
    spec:
      serviceAccountName: sok-web
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: sok-web}}}
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/sok.py"]
          ports: [{containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: NODE_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            # DMOBNK on this cluster: card payments and the CRM (../common/store.py).
            - {name: CRM_NAMESPACE, value: dmobnk}
            - name: SOK_HOST
              valueFrom: {configMapKeyRef: {name: dmoshp-sok, key: host, optional: true}}
            - name: INGRESS_CLASS
              valueFrom: {configMapKeyRef: {name: dmoshp-sok, key: ingressClass, optional: true}}
            - name: STORE_NAME
              valueFrom: {configMapKeyRef: {name: dmoshp-sok, key: name, optional: true}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: lib, mountPath: /opt/dmobnk, readOnly: true}
            - {name: crm-link, mountPath: /etc/dmobnk-crm, readOnly: true}
      volumes:
        - {name: script, configMap: {name: dmoshp-sok-script}}
        - {name: lib, configMap: {name: dmoshp-lib}}
        # A CRM on another cluster: a dmobnk-crm-link Secret here (url, token).
        - {name: crm-link, secret: {secretName: dmobnk-crm-link, optional: true}}
---
apiVersion: v1
kind: Service
metadata: {name: sok-web, namespace: dmoshp}
spec: {selector: {app: sok-web}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sok-web, namespace: dmoshp}
---
# It creates and points its own Ingress (../common/ingress_host.py).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sok-web, namespace: dmoshp}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["sok-web"]
    verbs: ["get", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["sok-web"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sok-web, namespace: dmoshp}
subjects:
  - {kind: ServiceAccount, name: sok-web, namespace: dmoshp}
roleRef: {kind: Role, name: sok-web, apiGroup: rbac.authorization.k8s.io}
