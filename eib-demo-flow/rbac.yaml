apiVersion: v1
kind: ServiceAccount
metadata:
  name: eib-flow
  namespace: apps
---
# Backs the "Run build" button: the api sidecar doesn't run the
# simulated build itself (same lesson from website/'s madness button --
# a long-running sequence inside a pod that something else in the
# namespace could kill mid-run is fragile); it dispatches a one-off Job
# and only needs to create it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eib-flow-create-build-job
  namespace: apps
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eib-flow-create-build-job
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: eib-flow
    namespace: apps
roleRef:
  kind: Role
  name: eib-flow-create-build-job
  apiGroup: rbac.authorization.k8s.io
---
# The build Job itself never touches the k8s API -- it only simulates
# pipeline stages and writes progress to Redis -- so this SA has no
# Role bound to it at all. It exists only so the Job's pods have their
# own clear identity (kubectl get sa) instead of running as the
# namespace's default ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eib-flow-build
  namespace: apps
