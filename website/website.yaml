apiVersion: v1
kind: ConfigMap
metadata:
  name: website-html
  namespace: apps
data:
  index.html.tmpl: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kubernetes Test Site</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0;
          min-height: 100vh;
          padding: 2.5rem 1rem;
          display: flex;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0f172a;
          color: #e2e8f0;
        }
        .page { width: 100%; max-width: 56rem; display: flex; flex-direction: column; gap: 1.25rem; }
        .panel {
          padding: 1.5rem 1.75rem;
          border-radius: 0.75rem;
          background: #1e293b;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h1 { margin: 0 0 0.3rem; font-size: 1.5rem; display: flex; align-items: center; gap: 0.6rem; }
        h2 { margin: 0; font-size: 1rem; }
        p.lead { color: #94a3b8; margin: 0; }
        p.hint { margin: 0.35rem 0 0; font-size: 0.8rem; color: #64748b; }
        .panel-header { padding: 0.9rem 1.1rem; }
        .panel-header h1 { font-size: 1.05rem; margin-bottom: 0.15rem; }
        .panel-header .live-dot { width: 0.45rem; height: 0.45rem; }
        .panel-header p.lead { font-size: 0.78rem; }
        .panel-header p.hint { font-size: 0.72rem; }

        .madness-btn {
          margin-top: 0.75rem;
          padding: 0.65rem 1.25rem;
          border: none;
          border-radius: 0.5rem;
          background: linear-gradient(135deg, #f87171, #c026d3);
          color: #fff;
          font-weight: 700;
          font-size: 0.85rem;
          cursor: pointer;
          transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .madness-btn:hover:not(:disabled) { transform: scale(1.03); }
        .madness-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .madness-status { margin-top: 0.75rem; display: none; }
        .madness-status.show { display: block; }
        .madness-bar { height: 10px; background: #0f172a; border-radius: 999px; overflow: hidden; }
        .madness-bar-fill {
          height: 100%; width: 0%; background: linear-gradient(90deg, #f87171, #c026d3);
          transition: width 0.3s ease;
        }
        .madness-status p { margin: 0.4rem 0 0; }
        dl.compact { margin-top: 0.6rem; padding: 0.6rem 0.7rem; font-size: 0.78rem; gap: 0.3rem 0.75rem; }
        .live-dot {
          width: 0.6rem; height: 0.6rem; border-radius: 50%;
          background: #4ade80; flex: none;
          animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
          50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
        }
        dl {
          display: grid;
          grid-template-columns: auto 1fr;
          gap: 0.5rem 1rem;
          margin: 1rem 0 0;
          font-size: 0.9rem;
          padding: 1rem;
          border-radius: 0.5rem;
          transition: background 0.5s ease;
        }
        dl.flash { background: #334155; }
        dt { color: #94a3b8; }
        dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }

        /* -- topology network diagram -- */
        .topo-figure { margin: 1.1rem 0 0; }
        .topo-svg { width: 100%; height: auto; display: block; }
        .topo-figure figcaption { margin-top: 0.6rem; font-size: 0.78rem; color: #64748b; }
        /* Brief highlight when a real request actually goes to Redis --
           distinct blue, so it never reads as the green "current pod" or
           the amber Redis identity color. */
        .topo-svg .db-arrow, .topo-svg #db-box { transition: stroke 0.15s ease, stroke-width 0.15s ease, fill-opacity 0.15s ease; }
        .topo-svg .db-arrow.pulse { stroke: #38bdf8 !important; stroke-width: 3 !important; stroke-opacity: 1 !important; }
        .topo-svg #db-box.pulse { stroke: #38bdf8; fill: #38bdf8; fill-opacity: 0.28; }
        .topo-svg #db-activity { opacity: 0; transition: opacity 0.15s ease; }
        .topo-svg #db-activity.show { opacity: 1; }
        /* Traveling packet, browser -> ingress -> service. Fixed pixel
           values (46 = browser box bottom, 166 = service box top) --
           those three boxes sit on the same vertical line at every node
           count, so this never needs to be regenerated per render. */
        .topo-svg .packet { fill: #38bdf8; animation: packet-travel 2.2s linear infinite; }
        @keyframes packet-travel {
          0%   { cy: 46px;  opacity: 0; }
          6%   { opacity: 1; }
          94%  { opacity: 1; }
          100% { cy: 166px; opacity: 0; }
        }
        .topology-empty { font-size: 0.85rem; color: #64748b; }
      </style>
    </head>
    <body>
      <div class="page">
        <div class="panel panel-header">
          <h1><span class="live-dot"></span>Kubernetes Test Site</h1>
          <p class="lead">A static demo site for testing this cluster -- deployments, rollouts, scaling, and Service load-balancing.</p>
          <dl id="card" class="compact">
            <dt>Served by pod</dt><dd id="pod">__POD_NAME__</dd>
            <dt>On node</dt><dd id="node">__NODE_NAME__</dd>
            <dt>Pod IP</dt><dd id="ip">__POD_IP__</dd>
            <dt>Pod changes seen</dt><dd id="changes">0</dd>
            <dt>Total visits (all-time)</dt><dd id="visits">&hellip;</dd>
          </dl>
          <p class="hint">Polling every ~1.5s, bypassing cache -- the Service spreads requests across replicas, so this updates live as it lands on different pods. Total visits is a counter in Redis (persistent volume), shared across every pod and every visitor.</p>
        </div>

        <div class="panel">
          <h2>Danger zone</h2>
          <p class="hint">Fires 10,000 requests at the site and scales <code>website</code> to 100 replicas for 60s, then back to 3. One run at a time, shared with everyone viewing this page right now.</p>
          <button id="madness-btn" class="madness-btn">&#128293; Chaos to Madness</button>
          <div id="madness-status" class="madness-status">
            <div class="madness-bar"><div id="madness-bar-fill" class="madness-bar-fill"></div></div>
            <p id="madness-text" class="hint"></p>
          </div>
        </div>

        <div class="panel">
          <h2>Cluster topology</h2>
          <p class="hint">The actual request path, drawn live from the k8s API.</p>
          <div id="topology">Loading&hellip;</div>
        </div>
      </div>

      <script>
        // Status colors, not identity ones -- reserved and never reused for
        // anything else in this diagram, so green/red only ever mean one
        // thing: this pod currently passes k8s's own Ready condition.
        const STATUS_GOOD = '#4ade80';
        const STATUS_CRITICAL = '#f87171';
        function shortName(pod) { return pod.split('-').pop(); }

        let lastPod = document.getElementById('pod').textContent;
        let changes = 0;

        async function poll() {
          try {
            const res = await fetch('/?_=' + Date.now(), { cache: 'no-store' });
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const newPod = doc.getElementById('pod').textContent;
            if (newPod !== lastPod) {
              changes++;
              document.getElementById('pod').textContent = newPod;
              document.getElementById('node').textContent = doc.getElementById('node').textContent;
              document.getElementById('ip').textContent = doc.getElementById('ip').textContent;
              document.getElementById('changes').textContent = changes;
              const card = document.getElementById('card');
              card.classList.add('flash');
              setTimeout(() => card.classList.remove('flash'), 500);
              lastPod = newPod;
              renderTopology(); // pod just changed -- refresh which card is highlighted
            }
          } catch (e) { /* transient fetch error -- next poll will retry */ }
        }

        const APP_NOTES = {
          nginx: 'nginx web server',
          render: 'renders index.html from downward-API values',
          api: 'serves this diagram’s data',
        };
        function esc(s) {
          return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function shortHost(name) { return name.split('.')[0]; }
        function shortOs(os) {
          if (!os) return 'OS unknown';
          const abbrev = [
            [/SUSE Linux Enterprise Server\s*/i, 'SLES '],
            [/Red Hat Enterprise Linux\s*/i, 'RHEL '],
            [/CentOS Linux\s*/i, 'CentOS '],
            [/Debian GNU\/Linux\s*/i, 'Debian '],
            [/Ubuntu\s*/i, 'Ubuntu '],
            [/Flatcar Container Linux by Kinvolk\s*/i, 'Flatcar '],
            [/Amazon Linux\s*/i, 'AL '],
          ];
          let s = os;
          for (const [re, repl] of abbrev) s = s.replace(re, repl);
          return s.length > 20 ? s.slice(0, 19) + '…' : s;
        }

        // Draws the actual request path -- browser -> ingress -> Service,
        // fanning out to every pod the Service can route to, laid out under
        // the node each pod is scheduled on. The one path a poll actually
        // took (Service -> the pod that answered) is highlighted; nodes
        // with no website pod are drawn empty on purpose, so a node falling
        // out of the fan-out (e.g. cordoned, or just never scheduled onto)
        // is visible, not omitted.
        function buildTopologySVG(data) {
          const nodes = data.nodes || [];
          const n = nodes.length;
          if (n === 0) return '<p class="topology-empty">No node data yet&hellip;</p>';

          const marginX = 20, colGap = 18, colW = 150;
          const width = marginX * 2 + n * colW + Math.max(0, n - 1) * colGap;
          const boxH = 32, gapV = 44;
          const browserY = 14, ingressY = browserY + boxH + gapV, serviceY = ingressY + boxH + gapV;
          const nodeRowY = serviceY + boxH + 58;
          const cx = width / 2;

          // Each pod gets a fixed-height slot (room for its name row plus up
          // to 3 container rows) regardless of how many other pods share its
          // node -- website-load.yaml can burst this to 10 replicas across 5
          // nodes, and dividing a fixed box height by pod count (the old
          // approach) squeezed names into overlapping mush once a node had
          // more than one or two. The box grows to fit the pods, stacked
          // vertically, instead of the pods shrinking to fit the box. Every
          // node column uses the same height (the tallest node's), so the
          // row still reads as a grid.
          const HEADER_H = 40, POD_UNIT_H = 62, POD_GAP = 8, MIN_NODE_BOX_H = 156;
          function nodeBoxHeightFor(node) {
            const count = (node.pods || []).length;
            if (count === 0) return MIN_NODE_BOX_H;
            return Math.max(MIN_NODE_BOX_H, HEADER_H + count * POD_UNIT_H + (count - 1) * POD_GAP + 10);
          }
          const nodeBoxH = Math.max(MIN_NODE_BOX_H, ...nodes.map(nodeBoxHeightFor));

          const db = data.database || null;
          const dbGapV = 56, dbBoxW = 220, dbBoxH = 46;
          const pvcGap = 18, pvcRx = 20, pvcRy = 6, pvcBodyH = 18;
          const dbRowY = nodeRowY + nodeBoxH + dbGapV;
          const height = db
            ? dbRowY + dbBoxH + pvcGap + pvcRy * 2 + pvcBodyH + 16
            : nodeRowY + nodeBoxH + 16;

          const totalPods = nodes.reduce((sum, node) => sum + (node.pods || []).length, 0);
          const occupied = nodes.filter((node) => (node.pods || []).length > 0).length;

          const parts = [];
          parts.push(
            '<defs>' +
              '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
                '<path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>' +
              '</marker>' +
              '<marker id="arrow-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
                '<path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>' +
              '</marker>' +
            '</defs>'
          );

          function box(x, y, w, h, label, opts) {
            opts = opts || {};
            const fill = opts.fill || '#0f172a';
            const stroke = opts.stroke || '#475569';
            const sw = opts.strokeWidth || 1.5;
            const textFill = opts.textFill || '#e2e8f0';
            const fs = opts.fontSize || 11;
            parts.push(
              '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="7" ' +
                'fill="' + fill + '" fill-opacity="' + (opts.fillOpacity != null ? opts.fillOpacity : 1) + '" ' +
                'stroke="' + stroke + '" stroke-width="' + sw + '"/>' +
              '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + fs / 3) + '" text-anchor="middle" ' +
                'font-size="' + fs + '" fill="' + textFill + '">' + esc(label) + '</text>'
            );
          }

          function arrow(x1, y1, x2, y2, opts) {
            opts = opts || {};
            const live = !!opts.live;
            parts.push(
              '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' +
                (opts.cls ? 'class="' + opts.cls + '" ' : '') +
                'stroke="' + (live ? '#4ade80' : '#475569') + '" stroke-width="' + (live ? 2.5 : 1.4) + '" ' +
                (live ? '' : 'stroke-opacity="0.6" ') +
                'marker-end="url(#' + (live ? 'arrow-live' : 'arrow') + ')"/>'
            );
            if (opts.label) {
              const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
              const anchorRight = mx >= cx;
              parts.push(
                '<text x="' + (mx + (anchorRight ? 8 : -8)) + '" y="' + (my - 4) + '" ' +
                  'text-anchor="' + (anchorRight ? 'start' : 'end') + '" font-size="9.5" ' +
                  'fill="' + (live ? '#4ade80' : '#64748b') + '">' + esc(opts.label) + '</text>'
              );
            }
          }

          // A flat database-cylinder icon: two ellipses (top open, bottom
          // capped with the panel's own background so it reads as solid)
          // joined by two straight sides -- the standard shorthand for
          // "persistent storage", not a generic box.
          function pvcIcon(x, y, rx, ry, bodyH, label) {
            const bottomY = y + bodyH;
            parts.push(
              '<line x1="' + (x - rx) + '" y1="' + y + '" x2="' + (x - rx) + '" y2="' + bottomY + '" stroke="#475569" stroke-width="1.3"/>' +
              '<line x1="' + (x + rx) + '" y1="' + y + '" x2="' + (x + rx) + '" y2="' + bottomY + '" stroke="#475569" stroke-width="1.3"/>' +
              '<ellipse cx="' + x + '" cy="' + bottomY + '" rx="' + rx + '" ry="' + ry + '" fill="#1e293b" stroke="#475569" stroke-width="1.3"/>' +
              '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" fill="#0f172a" stroke="#475569" stroke-width="1.3"/>' +
              '<text x="' + x + '" y="' + (bottomY + ry + 13) + '" text-anchor="middle" font-size="8.5" fill="#64748b">' + esc(label) + '</text>'
            );
          }

          box(cx - 60, browserY, 120, boxH, 'You (browser)', { fontSize: 10.5 });
          box(cx - 80, ingressY, 160, boxH, 'Ingress (traefik)', { fontSize: 10.5 });
          box(cx - 100, serviceY, 200, boxH, 'Service: website', { fontSize: 11 });

          arrow(cx, browserY + boxH, cx, ingressY, { label: 'HTTPS' });
          arrow(cx, ingressY + boxH, cx, serviceY, { label: 'proxies to' });

          // A traveling packet, browser -> ingress -> service. All three
          // boxes sit on the same vertical line at cx regardless of node
          // count, so a straight CSS-animated cy (browserY+boxH ->
          // serviceY, fixed pixel values, no per-render JS needed) is
          // enough -- no curved path required. Loops on its own via CSS;
          // survives the 4s topology re-render same as any other element.
          parts.push('<circle class="packet" cx="' + cx + '" r="4"/>');

          const occupiedCenters = [];
          nodes.forEach((node, i) => {
            const nodeX = marginX + i * (colW + colGap);
            const pods = node.pods || [];
            const current = pods.find((p) => p.name === lastPod);
            if (pods.length > 0) occupiedCenters.push(nodeX + colW / 2);

            if (pods.length > 0) {
              arrow(cx, serviceY + boxH, nodeX + colW / 2, nodeRowY, {
                live: !!current,
                label: current ? 'answered you' : null,
              });
            }

            const osTitle = esc(node.os || 'OS unknown');
            parts.push(
              '<rect x="' + nodeX + '" y="' + nodeRowY + '" width="' + colW + '" height="' + nodeBoxH + '" rx="8" ' +
                'fill="#0f172a" fill-opacity="0.5" stroke="#334155" stroke-width="1.5"/>' +
              '<text x="' + (nodeX + colW / 2) + '" y="' + (nodeRowY + 16) + '" text-anchor="middle" ' +
                'font-size="10" fill="#94a3b8">' + esc(shortHost(node.name)) + '</text>' +
              '<g><title>' + osTitle + '</title>' +
                '<text x="' + (nodeX + colW / 2) + '" y="' + (nodeRowY + 28) + '" text-anchor="middle" ' +
                  'font-size="8" fill="#64748b">' + esc(shortOs(node.os)) + '</text>' +
              '</g>'
            );

            if (pods.length === 0) {
              parts.push(
                '<text x="' + (nodeX + colW / 2) + '" y="' + (nodeRowY + nodeBoxH / 2 + 6) + '" ' +
                  'text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">no pod here</text>'
              );
              return;
            }

            const podAreaY = nodeRowY + HEADER_H;
            pods.forEach((p, j) => {
              const py = podAreaY + j * (POD_UNIT_H + POD_GAP);
              const ph = POD_UNIT_H;
              const isCurrent = p.name === lastPod;
              // Status color, not identity -- green/red only ever mean
              // "passes k8s's Ready condition" here. The check/cross glyph
              // repeats that in shape too, not just hue, per the checkmark
              // vs. plain color-coding: a colorblind reader still sees
              // which pods chaos just crashed and which recovered.
              const color = p.ready ? STATUS_GOOD : STATUS_CRITICAL;
              const glyph = p.ready ? '✓' : '✕';
              const statusTitle = esc((p.ready ? 'Ready' : 'Not Ready') + (p.phase ? ' — phase: ' + p.phase : ''));
              parts.push(
                '<g><title>' + statusTitle + '</title>' +
                  '<rect x="' + (nodeX + 8) + '" y="' + py + '" width="' + (colW - 16) + '" height="' + ph + '" rx="5" ' +
                    'fill="' + color + '" fill-opacity="0.12" stroke="' + color + '" stroke-width="' + (isCurrent ? 2.2 : 1.2) + '"/>' +
                  '<text x="' + (nodeX + 14) + '" y="' + (py + 14) + '" font-size="9" font-weight="700" fill="' + color + '">' + glyph + '</text>' +
                  '<text x="' + (nodeX + 26) + '" y="' + (py + 14) + '" font-size="9" fill="#cbd5e1">' + esc(shortName(p.name)) + '</text>' +
                '</g>'
              );
              if (isCurrent) {
                parts.push(
                  '<text x="' + (nodeX + colW - 12) + '" y="' + (py + 14) + '" text-anchor="end" ' +
                    'font-size="8" fill="#4ade80">&#9679; live</text>'
                );
              }
              (p.containers || []).forEach((c, k) => {
                const lineY = py + 28 + k * 13;
                const dotColor = c.ready ? '#4ade80' : '#475569';
                const title = esc(c.name + ' (' + c.image + ')' + (APP_NOTES[c.name] ? ' — ' + APP_NOTES[c.name] : ''));
                parts.push(
                  '<g><title>' + title + '</title>' +
                    '<circle cx="' + (nodeX + 18) + '" cy="' + (lineY - 3) + '" r="2.5" fill="' + dotColor + '"/>' +
                    '<text x="' + (nodeX + 25) + '" y="' + lineY + '" font-size="8.5" fill="#64748b">' + esc(c.name) + '</text>' +
                  '</g>'
                );
              });
            });
          });

          if (db) {
            const dbX = cx - dbBoxW / 2;
            // Every app pod's api container is what actually talks to Redis
            // (see the container list above) -- draw the fan-in from the
            // nodes that have one, not from the Service, since the Service
            // never routes here. Tagged "db-arrow" so pulseDb() below can
            // flash them the instant a real request goes out.
            occupiedCenters.forEach((x) => arrow(x, nodeRowY + nodeBoxH, cx, dbRowY, { cls: 'db-arrow' }));
            parts.push(
              '<text x="' + cx + '" y="' + (dbRowY - 8) + '" text-anchor="middle" font-size="8.5" ' +
                'fill="#64748b">every pod’s api container reads &amp; writes here</text>'
            );

            const dbReady = (db.containers || []).some((c) => c.name === 'redis' && c.ready);
            parts.push(
              '<rect id="db-box" x="' + dbX + '" y="' + dbRowY + '" width="' + dbBoxW + '" height="' + dbBoxH + '" rx="7" ' +
                'fill="#c98500" fill-opacity="0.1" stroke="#c98500" stroke-width="1.5"/>' +
              '<circle cx="' + (dbX + 16) + '" cy="' + (dbRowY + 16) + '" r="3" fill="' + (dbReady ? '#4ade80' : '#475569') + '"/>' +
              '<text x="' + (dbX + 24) + '" y="' + (dbRowY + 19) + '" font-size="10.5" fill="#e2e8f0">Redis (website-redis)</text>' +
              '<text x="' + (dbX + 24) + '" y="' + (dbRowY + 34) + '" font-size="8.5" fill="#94a3b8">on ' + esc(shortHost(db.node || '?')) + '</text>' +
              '<text id="db-activity" x="' + (dbX + dbBoxW - 10) + '" y="' + (dbRowY - 20) + '" ' +
                'text-anchor="end" font-size="8.5" font-weight="600" fill="#38bdf8"></text>'
            );
            if (db.pvc) {
              const pvcLabel = db.pvc.name + ' — ' + db.pvc.capacity + ' (' + db.pvc.storageClass + ')';
              parts.push('<text x="' + (dbX + dbBoxW - 10) + '" y="' + (dbRowY + 19) + '" text-anchor="end" font-size="8" fill="#64748b">' + esc(db.pvc.capacity) + '</text>');
              arrow(cx, dbRowY + dbBoxH, cx, dbRowY + dbBoxH + pvcGap, {});
              pvcIcon(cx, dbRowY + dbBoxH + pvcGap, pvcRx, pvcRy, pvcBodyH, pvcLabel);
            }
          }

          const label = esc(
            'Browser to traefik to the website Service, fanning out to ' + totalPods +
            ' pod(s) across ' + occupied + ' of ' + n + ' node(s), all reading and writing the visit ' +
            'counter in Redis on a persistent volume. Pods are green with a check when Ready, red ' +
            'with a cross when not (e.g. just crashed). Green on an arrow marks the path your last poll took.'
          );
          return (
            '<figure class="topo-figure">' +
              '<svg viewBox="0 0 ' + width + ' ' + height + '" class="topo-svg" role="img" aria-label="' + label + '">' +
                parts.join('') +
              '</svg>' +
              '<figcaption>' + label + '</figcaption>' +
            '</figure>'
          );
        }

        let topologyEverRendered = false;
        async function renderTopology() {
          const el = document.getElementById('topology');
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3000);
          try {
            const res = await fetch('/api/topology?_=' + Date.now(), { cache: 'no-store', signal: controller.signal });
            const data = await res.json();
            el.innerHTML = buildTopologySVG(data);
            topologyEverRendered = true;
          } catch (e) {
            // A load burst (website-load scaling to 100, or chaos mid-kill)
            // can make one poll miss -- the next one 4s later usually just
            // works. Blanking out a perfectly good diagram over one flaky
            // poll reads as broken; only show the placeholder if nothing
            // has ever rendered yet (e.g. the very first load).
            if (!topologyEverRendered) {
              el.innerHTML = '<p class="topology-empty">Topology temporarily unavailable&hellip;</p>';
            }
          } finally {
            clearTimeout(timeout);
          }
        }

        // Flashes the Redis box and its fan-in arrows in the topology
        // diagram the instant a request to it actually goes out, and shows
        // which kind. A no-op if the topology diagram hasn't rendered yet
        // (getElementById returns null before the first renderTopology()).
        let dbPulseTimer = null;
        function pulseDb(kind) {
          const box = document.getElementById('db-box');
          if (!box) return;
          const tag = document.getElementById('db-activity');
          const arrows = document.querySelectorAll('.db-arrow');
          box.classList.add('pulse');
          arrows.forEach((a) => a.classList.add('pulse'));
          if (tag) {
            tag.textContent = kind === 'write' ? 'WRITE ↓' : 'READ ↑';
            tag.classList.add('show');
          }
          clearTimeout(dbPulseTimer);
          dbPulseTimer = setTimeout(() => {
            box.classList.remove('pulse');
            arrows.forEach((a) => a.classList.remove('pulse'));
            if (tag) tag.classList.remove('show');
          }, 450);
        }

        // Recorded once per real page load, not per poll -- the poll loop
        // re-fetches '/' every 1.5s to watch pods cycle, and counting that
        // as a "visit" would make the number meaningless.
        async function recordVisit() {
          try {
            const res = await fetch('/api/visit', { method: 'POST', cache: 'no-store' });
            const data = await res.json();
            pulseDb('write');
            if (data.visits != null) document.getElementById('visits').textContent = data.visits;
          } catch (e) { /* Redis or the sidecar may be briefly unavailable */ }
        }
        async function refreshVisits() {
          try {
            const res = await fetch('/api/stats?_=' + Date.now(), { cache: 'no-store' });
            const data = await res.json();
            pulseDb('read');
            if (data.visits != null) document.getElementById('visits').textContent = data.visits;
          } catch (e) { /* next refresh will retry */ }
        }

        // "Chaos to madness": one button, shared state. Whoever clicks it
        // starts the run for everyone currently on the page -- polling
        // /api/madness (not a client-side timer) is what makes every open
        // tab show the same live progress, including tabs that didn't
        // click it themselves.
        const madnessBtn = document.getElementById('madness-btn');
        const madnessStatusEl = document.getElementById('madness-status');
        const madnessBarFill = document.getElementById('madness-bar-fill');
        const madnessText = document.getElementById('madness-text');
        let madnessPollTimer = null;

        function renderMadness(state) {
          if (state.running) {
            madnessBtn.disabled = true;
            madnessBtn.textContent = 'Madness in progress…';
            madnessStatusEl.classList.add('show');
            const pct = state.total ? Math.min(100, Math.round((state.sent / state.total) * 100)) : 0;
            madnessBarFill.style.width = pct + '%';
            madnessText.textContent = state.phase + (state.total ? ' (' + state.sent + '/' + state.total + ')' : '');
            if (!madnessPollTimer) madnessPollTimer = setInterval(pollMadness, 700);
          } else {
            madnessBtn.disabled = false;
            madnessBtn.textContent = '\u{1F525} Chaos to Madness';
            if (madnessPollTimer) { clearInterval(madnessPollTimer); madnessPollTimer = null; }
            madnessStatusEl.classList.remove('show');
          }
        }

        async function pollMadness() {
          try {
            const res = await fetch('/api/madness?_=' + Date.now(), { cache: 'no-store' });
            renderMadness(await res.json());
          } catch (e) { /* next poll will retry */ }
        }

        madnessBtn.addEventListener('click', async () => {
          madnessBtn.disabled = true;
          try {
            const res = await fetch('/api/madness', { method: 'POST', cache: 'no-store' });
            const data = await res.json();
            renderMadness(data);
            if (!data.started) {
              madnessText.textContent = 'Already running (someone beat you to it) — showing live progress.';
              madnessStatusEl.classList.add('show');
              if (!madnessPollTimer) madnessPollTimer = setInterval(pollMadness, 700);
            }
          } catch (e) { madnessBtn.disabled = false; }
        });

        recordVisit();
        renderTopology();
        pollMadness(); // pick up an already-in-progress run from another visitor
        setInterval(poll, 1500);
        setInterval(renderTopology, 4000);
        setInterval(refreshVisits, 5000);
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-nginx-conf
  namespace: apps
data:
  # Every poll from the page's JS must reach a backend pod fresh, not a
  # cached copy, or the "served by pod" cycling wouldn't reflect reality.
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      location /api/ {
        proxy_pass http://127.0.0.1:8080/;
      }
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-api-script
  namespace: apps
data:
  api.py: |
    import json
    import ssl
    import threading
    import time
    import urllib.request
    import redis
    from concurrent.futures import ThreadPoolExecutor
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    K8S_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    K8S_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    NAMESPACE = "apps"

    r = redis.Redis(
        host="website-redis.apps.svc.cluster.local", port=6379,
        decode_responses=True, socket_timeout=2, socket_connect_timeout=2,
    )
    VISITS_KEY = "website:visits"

    def record_visit():
        try:
            return r.incr(VISITS_KEY)
        except Exception:
            return None

    def get_visits():
        try:
            return int(r.get(VISITS_KEY) or 0)
        except Exception:
            return None

    def k8s_api_get(path):
        with open(K8S_TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}",
            headers={"Authorization": f"Bearer {token}"},
        )
        with urllib.request.urlopen(req, context=ctx, timeout=3) as resp:
            return json.load(resp)

    def scale_website(replicas):
        with open(K8S_TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(
            f"https://kubernetes.default.svc/apis/apps/v1/namespaces/{NAMESPACE}/deployments/website/scale",
            method="PATCH",
            data=json.dumps({"spec": {"replicas": replicas}}).encode(),
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/merge-patch+json",
            },
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5):
            pass

    MADNESS_TOTAL = 10000
    MADNESS_REPLICAS = 100
    MADNESS_HOLD_SECS = 60
    _madness_lock = threading.Lock()
    _madness_state = {"running": False, "sent": 0, "total": 0, "phase": ""}

    def _fire_one():
        try:
            with urllib.request.urlopen("http://website.apps.svc.cluster.local/", timeout=3):
                pass
        except Exception:
            pass  # a handful of failed requests under 100x load is expected, not fatal

    def _run_madness():
        try:
            _madness_state.update(running=True, sent=0, total=MADNESS_TOTAL, phase="scaling up")
            scale_website(MADNESS_REPLICAS)

            _madness_state["phase"] = "firing requests"
            with ThreadPoolExecutor(max_workers=80) as pool:
                # as_completed via map -- just need the count, not results.
                for _ in pool.map(lambda _: _fire_one(), range(MADNESS_TOTAL)):
                    _madness_state["sent"] += 1

            _madness_state["phase"] = f"holding at {MADNESS_REPLICAS} for {MADNESS_HOLD_SECS}s"
            time.sleep(MADNESS_HOLD_SECS)

            _madness_state["phase"] = "scaling back down"
            scale_website(3)
        except Exception as e:
            _madness_state["phase"] = f"error: {e}"
        finally:
            _madness_state["running"] = False

    def start_madness():
        with _madness_lock:
            if _madness_state["running"]:
                return False
            _madness_state["running"] = True  # claim it before the thread starts, avoid a race
        threading.Thread(target=_run_madness, daemon=True).start()
        return True

    def container_status(pod, name, kind):
        key = "initContainerStatuses" if kind == "init" else "containerStatuses"
        for cs in pod.get("status", {}).get(key, []):
            if cs.get("name") != name:
                continue
            if kind == "init":
                state = cs.get("state", {})
                return "terminated" in state and state["terminated"].get("reason") == "Completed"
            return bool(cs.get("ready"))
        return False

    def pod_ready(pod):
        # The Ready *condition* is k8s's own authoritative answer (accounts
        # for readiness gates, not just "every container's ready flag is
        # true"), same signal the Service's own endpoint controller uses to
        # decide whether to route traffic to this pod at all.
        for cond in pod.get("status", {}).get("conditions", []):
            if cond.get("type") == "Ready":
                return cond.get("status") == "True"
        return False

    def pod_summary(pod):
        containers = []
        for c in pod.get("spec", {}).get("initContainers", []):
            containers.append({
                "name": c["name"], "image": c["image"], "kind": "init",
                "ready": container_status(pod, c["name"], "init"),
            })
        for c in pod.get("spec", {}).get("containers", []):
            containers.append({
                "name": c["name"], "image": c["image"], "kind": "main",
                "ready": container_status(pod, c["name"], "main"),
            })
        return {
            "name": pod["metadata"]["name"],
            "node": pod.get("spec", {}).get("nodeName"),
            "phase": pod.get("status", {}).get("phase"),
            "ready": pod_ready(pod),
            "containers": containers,
        }

    def list_pods(label_selector):
        try:
            data = k8s_api_get(f"/api/v1/namespaces/{NAMESPACE}/pods?labelSelector={label_selector}")
            return data.get("items", [])
        except Exception:
            return []

    def get_topology():
        try:
            nodes_data = k8s_api_get("/api/v1/nodes")
            node_os = {
                n["metadata"]["name"]: n.get("status", {}).get("nodeInfo", {}).get("osImage")
                for n in nodes_data.get("items", [])
            }
            node_names = sorted(node_os)
        except Exception:
            node_os = {}
            node_names = []

        by_node = {n: [] for n in node_names}
        for pod in list_pods("app%3Dwebsite"):
            summary = pod_summary(pod)
            node = summary["node"] or "(unscheduled)"
            by_node.setdefault(node, [])
            by_node[node].append(summary)

        redis_pods = list_pods("app%3Dwebsite-redis")
        database = pod_summary(redis_pods[0]) if redis_pods else None
        if database:
            # Static, not queried live -- the PVC's size/class rarely change,
            # and it would need RBAC this ServiceAccount deliberately doesn't
            # have (see rbac.yaml). Keep in sync with redis.yaml by hand.
            database["pvc"] = {"name": "website-redis-data", "capacity": "256Mi", "storageClass": "longhorn"}

        return {
            "nodes": [{"name": n, "os": node_os.get(n), "pods": by_node.get(n, [])} for n in sorted(by_node)],
            "database": database,
        }

    class Handler(BaseHTTPRequestHandler):
        def _json(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path.startswith("/topology"):
                self._json(200, get_topology())
            elif self.path.startswith("/stats"):
                self._json(200, {"visits": get_visits()})
            elif self.path.startswith("/madness"):
                self._json(200, dict(_madness_state))
            else:
                self._json(404, {"error": "not found"})

        def do_POST(self):
            if self.path.startswith("/visit"):
                self._json(200, {"visits": record_visit()})
            elif self.path.startswith("/madness"):
                started = start_madness()
                self._json(200 if started else 409, dict(_madness_state, started=started))
            else:
                self._json(404, {"error": "not found"})

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: apps
  labels:
    app: website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      serviceAccountName: website
      # Preferred, not required -- website-load.yaml scales this to 10
      # replicas on a 5-node cluster every 5 minutes, which a *required*
      # anti-affinity would make unsatisfiable (5 pods stuck Pending
      # forever, since there aren't 10 distinct nodes). Preferred still
      # spreads pods across free nodes whenever the scheduler can (so a
      # chaos-crashed pod's replacement still prefers an empty node), it
      # just stops blocking once nodes run out.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: website
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: render
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              sed -e "s/__POD_NAME__/${POD_NAME}/g" \
                  -e "s/__NODE_NAME__/${NODE_NAME}/g" \
                  -e "s/__POD_IP__/${POD_IP}/g" \
                  /template/index.html.tmpl > /html/index.html
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: template
              mountPath: /template
              readOnly: true
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # Without this, a container with no probe is considered Ready the
          # instant it starts, so a just-recreated pod (e.g. after chaos
          # crashes it) could be added to the Service's routing before
          # index.html is actually rendered. Fast on purpose -- nginx itself
          # starts in well under a second -- so this isn't what was making
          # requests fail; that was chaos's hard-kill, fixed separately.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        - name: api
          image: python:3.12-alpine
          command: ["sh", "-c", "pip install --no-cache-dir redis >/tmp/pip.log 2>&1 && python3 /app/api.py"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: api-script
              mountPath: /app
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: website-html
        - name: nginx-conf
          configMap:
            name: website-nginx-conf
        - name: api-script
          configMap:
            name: website-api-script
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 80
