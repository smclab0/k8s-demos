apiVersion: v1
kind: ConfigMap
metadata:
  name: website-html
  namespace: apps
data:
  index.html.tmpl: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kubernetes Test Site</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0f172a;
          color: #e2e8f0;
        }
        main {
          max-width: 32rem;
          padding: 2.5rem;
          border-radius: 0.75rem;
          background: #1e293b;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h1 { margin-top: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 0.6rem; }
        p.lead { color: #94a3b8; }
        .live-dot {
          width: 0.6rem; height: 0.6rem; border-radius: 50%;
          background: #4ade80; flex: none;
          animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
          50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
        }
        dl {
          display: grid;
          grid-template-columns: auto 1fr;
          gap: 0.5rem 1rem;
          margin: 1.5rem 0 0;
          font-size: 0.9rem;
          padding: 1rem;
          border-radius: 0.5rem;
          transition: background 0.5s ease;
        }
        dl.flash { background: #334155; }
        dt { color: #94a3b8; }
        dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
        .hint { margin-top: 1.5rem; font-size: 0.85rem; color: #64748b; }
      </style>
    </head>
    <body>
      <main>
        <h1><span class="live-dot"></span>Kubernetes Test Site</h1>
        <p class="lead">A static demo site for testing this cluster -- deployments, rollouts, scaling, and Service load-balancing.</p>
        <dl id="card">
          <dt>Served by pod</dt><dd id="pod">__POD_NAME__</dd>
          <dt>On node</dt><dd id="node">__NODE_NAME__</dd>
          <dt>Pod IP</dt><dd id="ip">__POD_IP__</dd>
          <dt>Pod changes seen</dt><dd id="changes">0</dd>
        </dl>
        <p class="hint">Polling every ~1.5s, bypassing cache -- the Service spreads requests across the 3 replicas, so this updates live as it lands on different pods.</p>
      </main>
      <script>
        let lastPod = document.getElementById('pod').textContent;
        let changes = 0;
        async function poll() {
          try {
            const res = await fetch('/?_=' + Date.now(), { cache: 'no-store' });
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const newPod = doc.getElementById('pod').textContent;
            if (newPod !== lastPod) {
              changes++;
              document.getElementById('pod').textContent = newPod;
              document.getElementById('node').textContent = doc.getElementById('node').textContent;
              document.getElementById('ip').textContent = doc.getElementById('ip').textContent;
              document.getElementById('changes').textContent = changes;
              const card = document.getElementById('card');
              card.classList.add('flash');
              setTimeout(() => card.classList.remove('flash'), 500);
              lastPod = newPod;
            }
          } catch (e) { /* transient fetch error -- next poll will retry */ }
        }
        setInterval(poll, 1500);
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-nginx-conf
  namespace: apps
data:
  # Every poll from the page's JS must reach a backend pod fresh, not a
  # cached copy, or the "served by pod" cycling wouldn't reflect reality.
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: apps
  labels:
    app: website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      initContainers:
        - name: render
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              sed -e "s/__POD_NAME__/${POD_NAME}/g" \
                  -e "s/__NODE_NAME__/${NODE_NAME}/g" \
                  -e "s/__POD_IP__/${POD_IP}/g" \
                  /template/index.html.tmpl > /html/index.html
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: template
              mountPath: /template
              readOnly: true
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: website-html
        - name: nginx-conf
          configMap:
            name: website-nginx-conf
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 80
