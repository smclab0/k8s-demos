apiVersion: v1
kind: ServiceAccount
metadata:
  name: website-load
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-load
  namespace: apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["website"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["website"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-load
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: website-load
    namespace: apps
roleRef:
  kind: Role
  name: website-load
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-load
  namespace: apps
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Load burst + 90s hold + scale-down comfortably finishes in under a
      # minute of actual work; generous ceiling still keeps this well clear
      # of the next 5-minute tick even if something runs slow.
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: website-load
          containers:
            - name: load
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl jq >/tmp/apk.log 2>&1

                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  API=https://kubernetes.default.svc
                  NS=apps

                  scale() {
                    curl -sS --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/merge-patch+json" \
                      -X PATCH "$API/apis/apps/v1/namespaces/$NS/deployments/website/scale" \
                      -d "{\"spec\":{\"replicas\":$1}}"
                    echo
                  }

                  # Read the Ingress's own host rather than hardcoding it --
                  # deploy.sh sets it dynamically from traefik's live IP, so
                  # it can differ from one deploy to the next.
                  HOST=$(curl -sS --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                    "$API/apis/networking.k8s.io/v1/namespaces/$NS/ingresses/website" \
                    | jq -r '.spec.rules[0].host // empty')

                  if [ -z "$HOST" ]; then
                    echo "could not read the website Ingress host, skipping this cycle"
                    exit 0
                  fi

                  echo "=== simulating ingress traffic load against https://$HOST/ (through traefik) ==="
                  OK=0
                  for i in $(seq 1 40); do
                    # --connect-to redirects only the TCP connection to
                    # traefik's in-cluster Service address, while SNI and
                    # the Host header stay as $HOST -- this is real ingress
                    # traffic (traefik does the routing), not a shortcut
                    # straight to the website Service.
                    code=$(curl -sS -k --connect-to "$HOST:443:rke2-traefik.kube-system.svc.cluster.local:443" \
                      -o /dev/null -w '%{http_code}' --max-time 3 "https://$HOST/" || echo "000")
                    [ "$code" = "200" ] && OK=$((OK + 1))
                  done
                  echo "sent 40 requests through traefik, $OK succeeded"

                  echo "=== scaling website 3 -> 10 for 90s in response to the load ==="
                  scale 10
                  sleep 90

                  echo "=== scaling website back down to 3 ==="
                  scale 3
                  echo "=== cycle complete ==="
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 64Mi
