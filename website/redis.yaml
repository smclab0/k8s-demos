apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: website-redis-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-redis
  namespace: apps
  labels:
    app: website-redis
spec:
  replicas: 1
  strategy:
    # A rolling update would briefly run two pods against the same RWO PVC,
    # which most storage classes (including this cluster's longhorn) can't
    # attach to two pods at once -- recreate instead, a few seconds of
    # downtime for the counter beats a stuck rollout.
    type: Recreate
  selector:
    matchLabels:
      app: website-redis
  template:
    metadata:
      labels:
        app: website-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # AOF persistence so the visit counter survives a pod restart or
          # reschedule, not just a page reload -- the whole point of asking
          # for a *persistent* counter instead of the in-memory one this
          # replaced.
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: website-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: website-redis
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: website-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: website-redis
  namespace: apps
spec:
  # Selecting website-redis at all flips it to default-deny for the
  # direction(s) listed below (Ingress only here) -- every other pod in the
  # namespace, including trading/'s own unrelated redis and anything else
  # sharing this namespace, loses access unless explicitly allowed. Egress
  # from website-redis itself is untouched (no egress policyType), so its
  # own outbound traffic, if any, is unaffected.
  podSelector:
    matchLabels:
      app: website-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: website
        # The "chaos to madness" run is a one-off Job (website.yaml's
        # create_madness_job()), not a website pod -- it needs its own
        # entry here to write progress into the website:madness hash.
        # Deliberately its own label, not app: website, so it never
        # matches the website Service's selector and starts receiving
        # real traffic it can't serve.
        - podSelector:
            matchLabels:
              app: website-madness
      ports:
        - protocol: TCP
          port: 6379
