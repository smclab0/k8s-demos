apiVersion: v1
kind: ServiceAccount
metadata:
  name: website
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-read-pods
  namespace: apps
rules:
  # No resourceNames filter -- Pod names are dynamic (ReplicaSet-suffixed).
  # This technically permits listing any namespace's pod metadata (names,
  # node, container/image), same tradeoff trading-dashboard makes for nodes;
  # the api sidecar filters to label app=website itself.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-read-pods
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: website
    namespace: apps
roleRef:
  kind: Role
  name: website-read-pods
  apiGroup: rbac.authorization.k8s.io
---
# Backs the "chaos to madness" button (POST /api/madness): the api
# sidecar itself only *dispatches* the run as a one-off Job (see
# website.yaml's create_madness_job()) rather than scaling website
# in-process -- a background thread tied to one website pod's lifetime
# was the actual bug (that pod could be the one website-chaos kills
# mid-run, orphaning the scale-up with nothing left to scale it back
# down). The Job runs under website-load's ServiceAccount, which
# already has the scale grant it needs -- this Role only needs create.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-create-madness-job
  namespace: apps
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-create-madness-job
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: website
    namespace: apps
roleRef:
  kind: Role
  name: website-create-madness-job
  apiGroup: rbac.authorization.k8s.io
---
# Backs the "pause chaos" button: get+patch on website-chaos's own
# /scale subresource, so the api sidecar can read and toggle its
# replica count between 0 (paused) and 1 (running) -- resourceName-
# restricted to "website-chaos" specifically, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-pause-chaos
  namespace: apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["website-chaos"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-pause-chaos
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: website
    namespace: apps
roleRef:
  kind: Role
  name: website-pause-chaos
  apiGroup: rbac.authorization.k8s.io
---
# Nodes are cluster-scoped, so listing them needs a ClusterRole even though
# this ServiceAccount otherwise only touches things in the apps namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: website-read-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: website-read-nodes
subjects:
  - kind: ServiceAccount
    name: website
    namespace: apps
roleRef:
  kind: ClusterRole
  name: website-read-nodes
  apiGroup: rbac.authorization.k8s.io
